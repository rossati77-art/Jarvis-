const CORS_PROXIES = [
  (u) => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  (u) => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
];

async function fetchViaProxy(targetUrl, timeoutMs = 8000) {
  let lastErr = new Error('Nessun proxy CORS disponibile');
  for (const buildUrl of CORS_PROXIES) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const r = await fetch(buildUrl(targetUrl), { signal: ctrl.signal });
      if (!r.ok) { lastErr = new Error('HTTP ' + r.status); continue; }
      const j = await r.json();
      return j;
    } catch (e) {
      lastErr = e;
      continue;
    } finally {
      clearTimeout(t);
    }
  }
  throw lastErr;
}
async function resolveTickerForISIN(isin) {
  const url = `https://query2.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(isin)}&quotesCount=1&newsCount=0`;
  const j = await fetchViaProxy(url);
  const q = j?.quotes?.[0];
  return q?.symbol || null;
}
async function fetchYahooPrice(ticker) {
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}`;
  const j = await fetchViaProxy(url);
  const price = j?.chart?.result?.[0]?.meta?.regularMarketPrice;
  if (typeof price !== 'number') throw new Error('Nessun prezzo');
  return price;
}
async function fetchMarketPriceForISIN(isin, cachedTicker) {
  const ticker = cachedTicker || await resolveTickerForISIN(isin);
  if (!ticker) return { isin, ticker: null, status: 'no-ticker' };
  const price = await fetchYahooPrice(ticker);
  return { isin, ticker, status: 'ok', price };
}

function waitForGsi(maxWaitMs) {
  return new Promise((resolve) => {
    const start = Date.now();
    const check = () => {
      if (typeof google !== 'undefined' && google.accounts && google.accounts.oauth2) { resolve(true); return; }
      if (Date.now() - start > maxWaitMs) { resolve(false); return; }
      setTimeout(check, 150);
    };
    check();
  });
}

let gsiTokenClient = null;
function ensureGsiTokenClient(clientId) {
  if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) return null;
  if (!gsiTokenClient) {
    gsiTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: DRIVE_SCOPE,
      callback: () => {},
    });
  }
  return gsiTokenClient;
}
function requestDriveToken(clientId, interactive) {
  return new Promise((resolve) => {
    const client = ensureGsiTokenClient(clientId);
    if (!client) { resolve(null); return; }
    client.callback = (resp) => {
      if (resp && resp.error) { resolve(null); return; }
      resolve(resp.access_token);
    };
    try {
      client.requestAccessToken({ prompt: interactive ? 'consent' : '' });
    } catch (e) {
      resolve(null);
    }
  });
}

async function driveApi(token, path, options) {
  const res = await fetch('https://www.googleapis.com/drive/v3/' + path, {
    ...options,
    headers: { Authorization: 'Bearer ' + token, ...(options && options.headers) },
  });
  if (!res.ok) throw new Error('Drive API ' + res.status);
  return res.json();
}

async function driveFindOrCreateFolder(token) {
  const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const found = await driveApi(token, `files?q=${q}&fields=files(id,name)&spaces=drive`);
  if (found.files && found.files.length > 0) return found.files[0].id;
  const created = await driveApi(token, 'files?fields=id', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' }),
  });
  return created.id;
}

async function driveFindOrCreateFile(token, folderId, initialContent) {
  const q = encodeURIComponent(`'${folderId}' in parents and name='${DRIVE_FILE_NAME}' and trashed=false`);
  const found = await driveApi(token, `files?q=${q}&fields=files(id,name)&spaces=drive`);
  if (found.files && found.files.length > 0) return found.files[0].id;

  const boundary = 'gflc-boundary-' + uid();
  const metadata = { name: DRIVE_FILE_NAME, parents: [folderId], mimeType: 'application/json' };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${initialContent}\r\n--${boundary}--`;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': `multipart/related; boundary=${boundary}` },
    body,
  });
  if (!res.ok) throw new Error('Drive upload ' + res.status);
  const created = await res.json();
  return created.id;
}

async function driveDownloadFile(token, fileId) {
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
    headers: { Authorization: 'Bearer ' + token },
  });
  if (!res.ok) throw new Error('Drive download ' + res.status);
  return res.json();
}

async function driveUploadContent(token, fileId, content) {
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: 'PATCH',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: content,
  });
  if (!res.ok) throw new Error('Drive save ' + res.status);
  return res.json();
}

/* ---- Estrazione testo da PDF/Excel ---- */

async function extractPdfText(arrayBuffer) {
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    // Ricostruisce le righe visive raggruppando gli elementi di testo per coordinata Y (posizione verticale
    // sulla pagina) e ordinandoli per X: senza questo, PDF con layout a tabella (es. estratti conto) vengono
    // appiattiti su un'unica riga per pagina, rendendo impossibile riconoscere le singole righe di movimento.
    const rows = new Map();
    for (const it of content.items) {
      const y = Math.round(it.transform[5]);
      if (!rows.has(y)) rows.set(y, []);
      rows.get(y).push(it);
    }
    const ys = Array.from(rows.keys()).sort((a, b) => b - a);
    for (const y of ys) {
      const rowItems = rows.get(y).sort((a, b) => a.transform[4] - b.transform[4]);
      text += rowItems.map((it) => it.str).join(' ').replace(/\s+/g, ' ').trim() + '\n';
    }
  }
  return text;
}

async function extractFileText(arrayBuffer, mimeType, filename) {
  if (mimeType === 'application/pdf' || /\.pdf$/i.test(filename || '')) {
    return await extractPdfText(arrayBuffer);
  }
  if ((mimeType && mimeType.includes('spreadsheet')) || /\.(xlsx|xls|csv)$/i.test(filename || '')) {
    const wb = XLSX.read(arrayBuffer, { type: 'array' });
    return XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]);
  }
  return null;
}

function parseFiscaleText(text, tipo) {
  const t = (text || '').replace(/\s+/g, ' ');
  if (tipo === 'ISEE') {
    let m = t.match(/ISEE\s*(?:\d{4}[-\/]\d{4})?\s*[:\s]*€?\s*(\d[\d.,]*\d|\d)/i);
    const valore = m ? parseImporto(m[1]) : null;
    m = t.match(/\b(20\d{2})\b/);
    const anno = m ? Number(m[1]) : null;
    return { valore, anno, confidence: valore ? 'buona' : 'bassa' };
  }
  let redditoComplessivo = null;
  let m = t.match(/reddito\s*complessivo\s*[:\s]*€?\s*(\d[\d.,]*\d|\d)/i);
  if (m) redditoComplessivo = parseImporto(m[1]);
  let impostaNetta = null;
  m = t.match(/imposta\s*netta\s*[:\s]*€?\s*(\d[\d.,]*\d|\d)/i);
  if (m) impostaNetta = parseImporto(m[1]);
  let esito = null, importoEsito = null;
  m = t.match(/(rimborso|a\s*credito)\s*[:\s]*€?\s*(\d[\d.,]*\d|\d)/i);
  if (m) { esito = 'rimborso'; importoEsito = parseImporto(m[2]); }
  else {
    m = t.match(/a\s*debito\s*[:\s]*€?\s*(\d[\d.,]*\d|\d)/i);
    if (m) { esito = 'debito'; importoEsito = parseImporto(m[1]); }
  }
  m = t.match(/\b(20\d{2})\b/);
  const anno = m ? Number(m[1]) : null;
  return { redditoComplessivo, impostaNetta, esito, importoEsito, anno, confidence: (redditoComplessivo && anno) ? 'buona' : 'bassa' };
}

function classifyDocument(text, filename, pathHint) {
  const nameLower = (filename || '').toLowerCase();
  const t = text || '';
  const pathLower = (pathHint || []).join('/').toLowerCase();

  // Un CUD non è mai una busta paga mensile né un ISEE/730: va sempre escluso dall'import automatico,
  // indipendentemente dalla cartella in cui si trova.
  const looksCud = /\bcud\b/i.test(nameLower) || /\bcud\b/i.test(t) || /certificazione\s+unica/i.test(t);
  if (looksCud) return 'CUD';

  // Il nome della sottocartella (es. ".../CEDOLINI/ISEE/...", ".../CEDOLINI/730/...") è il segnale più affidabile.
  if (/(^|\/)isee(\/|$)/i.test(pathLower)) return 'ISEE';
  if (/(^|\/)730(\/|$)/i.test(pathLower)) return '730';

  const looksIsee = /\bisee\b/i.test(t) || /\bisee\b/i.test(nameLower);
  const looksSette30 = /modello\s*730|\b730\/20\d{2}|dichiarazione\s*dei\s*redditi/i.test(t) || /\b730\b/.test(nameLower);
  if (looksIsee) return 'ISEE';
  if (looksSette30) return '730';
  return 'cedolino';
}

async function scanLocalFiles(fileList, existingDocFiscali, onProgress) {
  const existingFiscaliLocalIds = new Set(existingDocFiscali.map(d => d.localFileId).filter(Boolean));
  const allFiles = Array.from(fileList || []).filter(f => /\.(pdf|jpe?g|png|csv|xlsx?|xls)$/i.test(f.name));
  const fiscaliResults = [];
  let totalNew = 0, totalScartati = 0;
  for (const f of allFiles) {
    const relPath = f.webkitRelativePath || f.name;
    const localFileId = 'local:' + relPath;
    if (existingFiscaliLocalIds.has(localFileId)) continue;
    totalNew++;
    onProgress && onProgress(f.name);
    const pathHint = relPath.split('/').slice(0, -1);
    try {
      if (f.type && f.type.startsWith('image/')) { totalScartati++; continue; }
      const buf = await f.arrayBuffer();
      const text = await extractFileText(buf, f.type, f.name);
      if (text === null) { totalScartati++; continue; }
      const kind = classifyDocument(text, f.name, pathHint);
      if (kind !== 'ISEE' && kind !== '730') { totalScartati++; continue; }
      const parsed = parseFiscaleText(text, kind);
      fiscaliResults.push({
        id: uid(), tipo: kind, localFileId, fileName: f.name, ricevuta: null,
        anno: parsed.anno, valore: parsed.valore ?? null,
        redditoComplessivo: parsed.redditoComplessivo ?? null, impostaNetta: parsed.impostaNetta ?? null,
        esito: parsed.esito ?? null, importoEsito: parsed.importoEsito ?? null,
        needsManual: parsed.confidence !== 'buona',
      });
    } catch (e) {
      totalScartati++;
    }
  }
  return { fiscaliResults, totalScanned: allFiles.length, totalNew, totalScartati };
}

function buildAiDataSnapshot(s) {
  const sum = (arr, f) => (arr || []).reduce((t, x) => t + (Number(f(x)) || 0), 0);
  const investimentiRiepilogo = {};
  Object.entries(s.investments || {}).forEach(([persona, list]) => {
    investimentiRiepilogo[persona] = {
      numeroTitoli: list.length,
      valoreAttuale: Math.round(sum(list, t => (t.prezzoCorrente || t.pma || 0) * (t.quantita || 0)) * 100) / 100,
    };
  });
  const entrate = computeEntrate(s.incomes, s.extraEntrate, s.movements || [], s.entrateMovements || [], s.period);
  const movFiltrati = (s.movements || []).filter(m => inPeriod(m.data, s.period));
  const uscitePeriodo = movFiltrati.filter(m => EXPENSE_CATS.includes(m.categoria) && m.importo < 0).reduce((t,m) => t + Math.abs(m.importo), 0);
  return {
    periodoFiltro: s.period,
    entrateDelPeriodo: {
      totale: Math.round(entrate.totale * 100) / 100,
      fonte: entrate.mode === 'movimenti' ? 'calcolate dagli accrediti reali nei movimenti importati (Fineco/Revolut)' : 'calcolate dai valori fissi impostati manualmente (nessun movimento con accrediti importato)',
      numeroAccrediti: entrate.movimenti.length,
    },
    uscitePeriodo: Math.round(uscitePeriodo * 100) / 100,
    entrateFisse: s.incomes,
    entrateExtra: s.extraEntrate,
    fido: s.fido,
    finanziamenti: s.finanziamenti,
    pensione: s.pensione,
    numeroTotaleMovimenti: (s.movements || []).length,
    movimentiRecenti: (s.movements || []).slice(-60).map(m => ({ data: m.data, descrizione: m.descrizione, importo: m.importo, categoria: m.categoria })),
    agenda: (s.agenda || []).map(a => ({ nome: a.nome, importo: a.importo, scadenza: a.scadenza, pagato: a.pagato, note: a.note })),
    investimentiRiepilogo,
    numeroTotaleBusteInPaga: (s.cedolini || []).length,
    busteRecenti: (s.cedolini || []).slice(-24).map(c => ({ azienda: c.azienda, mese: c.mese, anno: c.anno, netto: c.netto })),
    documentiFiscali: (s.docFiscali || []).map(d => ({ tipo: d.tipo, anno: d.anno, valore: d.valore })),
  };
}

function speakAiText(text, { onStart, onEnd } = {}) {
  try {
    if (!('speechSynthesis' in window) || !text) return;
    window.speechSynthesis.cancel();
    const clean = text.replace(/[*_#`]/g, '');
    const utter = new SpeechSynthesisUtterance(clean);
    utter.lang = 'it-IT';
    const voices = window.speechSynthesis.getVoices();
    const itVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('it'));
    if (itVoice) utter.voice = itVoice;
    utter.rate = 1.02;
    utter.onstart = () => { if (onStart) onStart(); };
    utter.onend = () => { if (onEnd) onEnd(); };
    utter.onerror = () => { if (onEnd) onEnd(); };
    window.speechSynthesis.speak(utter);
  } catch (e) {}
}
function stopAiSpeech() {
  try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
}

const AI_SPEECH_ERROR_MESSAGES = {
  'not-allowed': 'Permesso al microfono negato. Controlla le autorizzazioni del sito nel browser (icona lucchetto nella barra indirizzi) e riprova.',
  'service-not-allowed': 'Il browser ha bloccato il riconoscimento vocale su questa pagina (serve un indirizzo https:// oppure localhost, non funziona da un file aperto direttamente o da un link di Google Drive).',
  'audio-capture': 'Nessun microfono rilevato sul dispositivo.',
  'network': 'Errore di rete durante il riconoscimento vocale. Controlla la connessione internet.',
  'no-speech': 'Non ho sentito nulla, riprova.',
  'aborted': null,
};

function createAiSpeechRecognizer(onFinalText, onEnd, onError) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const rec = new SR();
  rec.lang = 'it-IT';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onresult = (e) => {
    const text = e.results && e.results[0] && e.results[0][0] && e.results[0][0].transcript;
    if (text) onFinalText(text);
  };
  rec.onend = onEnd;
  rec.onerror = (e) => {
    const code = e && e.error;
    const msg = AI_SPEECH_ERROR_MESSAGES.hasOwnProperty(code) ? AI_SPEECH_ERROR_MESSAGES[code] : `Errore riconoscimento vocale (${code || 'sconosciuto'})`;
    if (msg && onError) onError(msg);
    onEnd();
  };
  return rec;
}

async function callGeminiApi(apiKey, systemInstruction, contents) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: systemInstruction }] },
      contents,
      tools: [{ functionDeclarations: AI_TOOL_DECLARATIONS }],
      generationConfig: { maxOutputTokens: 1024 },
    }),
  });
  if (!res.ok) {
    let msg = `Errore Gemini (${res.status})`;
    try { const j = await res.json(); msg = (j && j.error && j.error.message) || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}

function executeAiTool(name, args, api) {
  args = args || {};
  if (name === 'aggiungiMovimento') {
    const importoAbs = Math.abs(Number(args.importo) || 0);
    if (!importoAbs) return { ok: false, message: 'Importo non valido' };
    const importo = args.tipo === 'entrata' ? importoAbs : -importoAbs;
    const data = /^\d{4}-\d{2}-\d{2}$/.test(args.data || '') ? args.data : new Date().toISOString().slice(0, 10);
    api.setMovements(prev => [...prev, { id: uid(), data, descrizione: args.descrizione || 'Movimento', importo, categoria: args.categoria || '' }]);
    return { ok: true, message: `Aggiunto movimento: "${args.descrizione}" di ${fmtEUR(importo)} in data ${data}` };
  }
  if (name === 'aggiungiVoceAgenda') {
    if (!args.nome || !args.importo) return { ok: false, message: 'Nome o importo mancanti' };
    api.setAgenda(prev => [mkAgendaItem(args.nome, Number(args.importo) || 0, args.scadenza || ''), ...prev]);
    return { ok: true, message: `Aggiunta voce Agenda: "${args.nome}" (${fmtEUR(Number(args.importo) || 0)}), scadenza ${args.scadenza || 'non specificata'}` };
  }
  if (name === 'segnaAgendaPagata') {
    const q = (args.nome || '').toLowerCase();
    const match = (api.agenda || []).find(a => a.nome.toLowerCase().includes(q));
    if (!match) return { ok: false, message: `Nessuna voce Agenda trovata per "${args.nome}"` };
    api.setAgenda(prev => prev.map(a => a.id === match.id ? { ...a, pagato: true } : a));
    return { ok: true, message: `Segnata come pagata: "${match.nome}"` };
  }
  if (name === 'aggiornaSaldoFido') {
    const val = Number(args.saldoAttuale);
    if (Number.isNaN(val)) return { ok: false, message: 'Valore non valido' };
    api.setFido(prev => ({ ...prev, saldoAttuale: val }));
    return { ok: true, message: `Saldo fido (già rimesso sul conto) aggiornato a ${fmtEUR(val)}` };
  }
  if (name === 'aggiungiEntrataExtra') {
    if (!args.nome || !args.importo) return { ok: false, message: 'Nome o importo mancanti' };
    api.setExtraEntrate(prev => [...prev, { id: uid(), nome: args.nome, importo: Number(args.importo) || 0 }]);
    return { ok: true, message: `Aggiunta entrata extra: "${args.nome}" (${fmtEUR(Number(args.importo) || 0)})` };
  }
  if (name === 'impostaEntrataFissa') {
    if (!['massimiliano', 'susj', 'inps', 'mamma'].includes(args.chiave)) return { ok: false, message: 'Chiave non valida' };
    const val = Number(args.importo);
    if (Number.isNaN(val)) return { ok: false, message: 'Valore non valido' };
    api.setIncomes(prev => ({ ...prev, [args.chiave]: val }));
    return { ok: true, message: `Entrata fissa "${args.chiave}" impostata a ${fmtEUR(val)}` };
  }
  if (name === 'impostaFiltroPeriodo') {
    const anno = Number(args.anno);
    if (!anno) return { ok: false, message: 'Anno non valido' };
    const mese = args.mese ? Number(args.mese) : null;
    api.setPeriod({ mese: (mese >= 1 && mese <= 12) ? mese : null, anno });
    return { ok: true, message: `Filtro periodo impostato su ${mese ? MESI[mese - 1] : 'tutti i mesi'} ${anno}` };
  }
  if (name === 'cambiaDashboard') {
    const valid = ['riepilogo', 'entrate', 'movimenti', 'analisiSpese', 'agenda', 'cedolini', 'investimenti', 'finanziamenti', 'pensione'];
    if (!valid.includes(args.dashboard)) return { ok: false, message: 'Dashboard non valida' };
    api.setView(args.dashboard);
    return { ok: true, message: `Aperta dashboard ${args.dashboard}` };
  }
  return { ok: false, message: `Funzione sconosciuta: ${name}` };
}

    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;

    if (!voiceOn || aiLoading) return;
    const last = aiMessages[aiMessages.length - 1];

      lastSpokenIdRef.current = last.id;
      speakAiText(last.text, { onStart: () => setSpeaking(true), onEnd: () => setSpeaking(false) });
    }

  useEffect(() => stopAiSpeech, []);

    if (listening) {

                    className={"w-9 h-9 rounded-full flex items-center justify-center shrink-0 transition-colors disabled:opacity-30 " + (listening ? "bg-rose-500 text-white animate-pulse" : "bg-white/10 text-zinc-400 hover:bg-white/15")}>

                  </button>
                )}
                <input type="text" value={input} onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => { if (e.key === 'Enter') handleSend(); }}
                  placeholder={listening ? "Ti ascolto..." : "Scrivi un messaggio..."} disabled={aiLoading}
                  className="flex-1 bg-white/5 border border-white/10 rounded-full px-3.5 py-2 text-[13px] outline-none focus:border-indigo-400/40 disabled:opacity-50" />

                  className="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-400 to-indigo-600 text-white flex items-center justify-center disabled:opacity-30 shrink-0 shadow-[0_2px_8px_-2px_rgba(99,102,241,0.6)]">
                  <Icons.Send size={15} />
                </button>
              </div>
            </>
          )}
        </div>
      )}
    </>
  );
}

function dataUrlToFile(dataUrl, filename, mimeType) {
  const arr = dataUrl.split(',');
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while (n--) u8arr[n] = bstr.charCodeAt(n);
  return new File([u8arr], filename, { type: mimeType || 'application/octet-stream' });
}

function FileViewerModal() {
  const { viewingFile, setViewingFile, pushToast } = useApp();
  if (!viewingFile) return null;
  const { name, type, dataUrl } = viewingFile;
  const isImage = type && type.startsWith('image/');
  const canShareFiles = typeof navigator !== 'undefined' && !!navigator.canShare;

  const handleShare = async () => {
    try {
      const file = dataUrlToFile(dataUrl, name, type);
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: name });
      } else {
        pushToast('La condivisione diretta non è supportata su questo dispositivo/browser: usa "Scarica" e poi condividi il file salvato.', 'warn');
      }
    } catch (e) {
      if (e && e.name !== 'AbortError') pushToast('Condivisione non riuscita.', 'error');
    }
  };

  return (
    <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4" onClick={() => setViewingFile(null)}>
      <div className="rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden border border-white/10" onClick={(e) => e.stopPropagation()}
        style={{ background:'linear-gradient(180deg, rgba(20,20,26,0.97), rgba(10,10,14,0.98))', backdropFilter:'blur(24px)', WebkitBackdropFilter:'blur(24px)' }}>
        <div className="px-4 py-3 border-b border-white/5 flex items-center justify-between shrink-0">
          <p className="text-sm font-semibold text-zinc-100 truncate pr-2">{name}</p>
          <button onClick={() => setViewingFile(null)} className="text-zinc-500 hover:text-zinc-200 shrink-0"><Icons.X size={18} /></button>
        </div>
        <div className="flex-1 overflow-auto bg-white/10 flex items-center justify-center min-h-[240px]">
          {isImage ? (
            <img src={dataUrl} alt={name} className="max-w-full max-h-[65vh] object-contain" />
          ) : (
            <iframe src={dataUrl} title={name} className="w-full h-[65vh] border-0 bg-white" />
          )}
        </div>
        <div className="px-4 py-3 border-t border-white/5 flex items-center gap-2 shrink-0">
          <a href={dataUrl} download={name} className="flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg bg-gradient-to-b from-indigo-400 to-indigo-600 text-white text-[12.5px] font-semibold hover:from-indigo-300 hover:to-indigo-500 transition-colors">
            <Icons.Download size={14} /> Scarica
          </a>
          {canShareFiles && (
            <button onClick={handleShare} className="flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg border border-white/10 text-zinc-200 text-[12.5px] font-semibold hover:bg-white/5 transition-colors">
              <Icons.Share2 size={14} /> Condividi
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

        const parts = (candidate && candidate.content && candidate.content.parts) || [];
        const functionCalls = parts.filter(p => p.functionCall);

          const textOut = parts.filter(p => p.text).map(p => p.text).join('\n').trim();

        const applyPrice = (t) => t.isin === isin ? { ...t, prezzoCorrente: price } : t;
        return {
          massimiliano: prev.massimiliano.map(applyPrice),
          giulia: prev.giulia.map(applyPrice),
          cristiano: prev.cristiano.map(applyPrice),
          alessandro: prev.alessandro.map(applyPrice),
          mamma: prev.mamma.map(applyPrice),
        };
      });
      pushToast(`Ticker aggiornato a "${ticker}": prezzo ${fmtEUR(price)}.`);
    } catch (e) {
      pushToast(`Nessun prezzo trovato per il ticker "${ticker}". Controlla che sia scritto esattamente come su Yahoo Finance (es. ESIF.DE).`, 'error');
    }
  }, [pushToast]);

  const clearTickerOverride = useCallback((isin) => {
    setMarketData(prev => {
      const next = { ...prev };
      delete next[isin];
      return next;
    });
    pushToast('Ticker azzerato: verrà cercato di nuovo automaticamente al prossimo aggiornamento.');
  }, [pushToast]);

  useEffect(() => {
    refreshMarketData();
    const interval = setInterval(refreshMarketData, 60000);
    return () => clearInterval(interval);
  }, [refreshMarketData]);

  const runLocalCedoliniScan = useCallback(async (fileList) => {
    if (!fileList || !fileList.length) { pushToast('Nessun file trovato in quella cartella. Se i file sono su Google Drive, assicurati che siano scaricati sul dispositivo (non "solo online") prima di selezionarla.', 'warn'); return; }
    setCedoliniScanStatus('scanning');
    setCedoliniScanProgress('');
    try {
      const { fiscaliResults, totalScartati } = await scanLocalFiles(
        fileList, docFiscaliRef.current,
        (name) => setCedoliniScanProgress(name)
      );
      if (fiscaliResults.length) setDocFiscali(prev => [...fiscaliResults, ...prev]);
      if (fiscaliResults.length === 0 && totalScartati === 0) {
        pushToast('Nessun nuovo documento trovato nella cartella locale');
      } else {
        const parts = [];
        if (fiscaliResults.length > 0) parts.push(`${fiscaliResults.length} nuovo/i documento/i importato/i`);
        if (totalScartati > 0) parts.push(`${totalScartati} scartato/i (non ISEE/730 o già presente/i)`);
        pushToast(parts.join(', ') + ' dalla cartella locale');
      }
      setCedoliniScanStatus('idle');
    } catch (e) {
      setCedoliniScanStatus('error');
      pushToast('Errore durante la scansione della cartella locale.', 'error');
    }
    setCedoliniScanProgress('');
    setCedoliniLastScan(Date.now());
  }, [pushToast]);

  const runMovimentiFolderScan = useCallback(async (fileList, source) => {
    if (!fileList || !fileList.length) { pushToast('Nessun file trovato in quella cartella.', 'warn'); return; }
    setMovimentiFolderScanStatus('scanning');
    setMovimentiFolderScanProgress('');
    try {
      const { movimenti, skipped } = await scanMovimentiLocalFiles(fileList, (name) => setMovimentiFolderScanProgress(name));
      const tagged = source === 'revolut' ? movimenti.map(m => ({ ...m, categoria: categorizza(m.descrizione) })) : movimenti;
      let added = 0, dup = 0;
      if (tagged.length > 0) {
        setMovements(prev => {
          const existingKeys = new Set(prev.map(movementKey));
          const fresh = [];
          for (const m of tagged) {
            const k = movementKey(m);
            if (existingKeys.has(k)) { dup++; continue; }
            existingKeys.add(k);
            fresh.push(m);
          }
          added = fresh.length;
          return fresh.length > 0 ? [...fresh, ...prev] : prev;
        });
      }
      if (skipped.length > 0) setMovimentiSkipped(prev => [...skipped.map(s => ({ id: uid(), name: s.name, reason: s.reason, fonte: source })), ...prev]);
      const label = source === 'fineco' ? 'Fineco' : 'Revolut';
      const parts = [];
      if (added > 0) parts.push(`${added} nuovo/i movimento/i`);
      if (dup > 0) parts.push(`${dup} già presente/i`);
      if (skipped.length > 0) parts.push(`${skipped.length} file non riconosciuto/i`);
      pushToast(parts.length ? `${parts.join(', ')} da ${label}` : `Nessun movimento trovato nella cartella ${label}`, parts.length ? undefined : 'warn');
      movimentiUsedFolders.current[source] = true;
    } catch (e) {
      pushToast('Errore durante la lettura della cartella.', 'error');
    }
    setMovimentiFolderScanStatus('idle');
    setMovimentiFolderScanProgress('');
    setMovimentiFolderLastScan(Date.now());
  }, [pushToast]);

  const runFinecoLocalScan = useCallback((fileList) => runMovimentiFolderScan(fileList, 'fineco'), [runMovimentiFolderScan]);
  const runRevolutLocalScan = useCallback((fileList) => runMovimentiFolderScan(fileList, 'revolut'), [runMovimentiFolderScan]);

  const refreshMovimentiFolders = useCallback(() => {
    if (!movimentiUsedFolders.current.fineco && !movimentiUsedFolders.current.revolut) {
      pushToast('Seleziona prima almeno una cartella (Fineco o Revolut).', 'warn');
      return;
    }
    if (movimentiUsedFolders.current.fineco) finecoFolderInputRef.current && finecoFolderInputRef.current.click();
    if (movimentiUsedFolders.current.revolut) revolutFolderInputRef.current && revolutFolderInputRef.current.click();
  }, []);

  const importEntrateRows = useCallback((movimenti, sourceLabel) => {
    const solEntrate = movimenti
      .filter(m => Number(m.importo) > 0 && m.categoria !== 'investimento')
      .map(m => ({ ...m, tipoEntrata: classificaEntrata(m.descrizione) }));
    let added = 0, dup = 0;
    if (solEntrate.length > 0) {
      setEntrateMovements(prev => {
        const existingKeys = new Set(prev.map(movementKey));
        const fresh = [];
        for (const m of solEntrate) {
          const k = movementKey(m);
          if (existingKeys.has(k)) { dup++; continue; }
          existingKeys.add(k);
          fresh.push(m);
        }
        added = fresh.length;
        return fresh.length > 0 ? [...fresh, ...prev] : prev;
      });
    }
    const parts = [];
    if (added > 0) parts.push(`${added} nuovo/i accredito/i`);
    if (dup > 0) parts.push(`${dup} già presente/i`);
    const scartati = movimenti.length - solEntrate.length;
    if (scartati > 0) parts.push(`${scartati} riga/e scartata/e (non è un accredito)`);
    pushToast(parts.length ? parts.join(', ') + ` da ${sourceLabel}` : `Nessun accredito riconosciuto in ${sourceLabel}`, parts.length ? undefined : 'warn');
  }, [pushToast]);

  const runEntrateFolderScan = useCallback(async (fileList) => {
    if (!fileList || !fileList.length) { pushToast('Nessun file trovato in quella cartella.', 'warn'); return; }
    setEntrateScanStatus('scanning');
    setEntrateScanProgress('');
    try {
      const { movimenti, skipped } = await scanMovimentiLocalFiles(fileList, (name) => setEntrateScanProgress(name));
      importEntrateRows(movimenti, 'cartella Entrate');
      if (skipped.length > 0) pushToast(`${skipped.length} file non riconosciuto/i nella cartella Entrate`, 'warn');
    } catch (err) {
      pushToast('Errore durante la lettura della cartella Entrate.', 'error');
    }
    setEntrateScanStatus('idle');
    setEntrateScanProgress('');
    setEntrateLastScan(Date.now());
  }, [pushToast, importEntrateRows]);

  // "Aggiorna Tutte le Cartelle": rilancia in sequenza la lettura di ogni cartella locale già collegata
  // (ISEE/730, Fineco, Revolut, Entrate). Ogni cartella richiede comunque una finestra di conferma nativa
  // del browser (per sicurezza non è possibile renderlo del tutto silenzioso): questa funzione le apre in
  // fila una dopo l'altra invece di dover andare a cercarle dashboard per dashboard.
  const pickFolderAndWait = useCallback((inputRef) => {
    return new Promise((resolve) => {
      const input = inputRef.current;
      if (!input) { resolve(); return; }
      let settled = false;
      const finish = () => {
        if (settled) return;
        settled = true;
        window.removeEventListener('focus', onFocus);
        resolve();
      };
      const onFocus = () => setTimeout(finish, 400);
      input.addEventListener('change', finish, { once: true });
      window.addEventListener('focus', onFocus, { once: true });
      input.click();
    });
  }, []);

  const runAggiornaTutteLeCartelle = useCallback(async () => {
    // Lo stato "cartella già collegata" (LastScan) vive solo in memoria e si azzera ad ogni ricarica
    // della pagina: per capire quali cartelle riproporre usiamo quindi la presenza di dati già importati
    // (persistiti), non solo la memoria di questa sessione, altrimenti dopo un reload il pulsante
    // risulterebbe sempre "nessuna cartella collegata" anche quando in realtà lo sono.
    const daAggiornare = [
      (cedoliniLastScan || docFiscali.length > 0) && cedoliniFolderInputRef,
      (cedoliniLastScan || docFiscali.length > 0) && setteTrentaFolderInputRef,
      (movimentiUsedFolders.current.fineco || movements.length > 0) && finecoFolderInputRef,
      (movimentiUsedFolders.current.revolut || movements.length > 0) && revolutFolderInputRef,
      (entrateLastScan || entrateMovements.length > 0) && entrateFolderInputRef,
    ].filter(Boolean);
    if (daAggiornare.length === 0) {
      pushToast('Nessuna cartella locale ancora collegata: importane almeno una dalla sua dashboard.', 'warn');
      return;
    }
    pushToast(`Aggiornamento di ${daAggiornare.length} cartella/e in corso: conferma ogni finestra che si apre.`);
    for (const ref of daAggiornare) {
      await pickFolderAndWait(ref);
    }
    pushToast('Aggiornamento di tutte le cartelle completato.');
  }, [cedoliniLastScan, entrateLastScan, docFiscali, movements, entrateMovements, pushToast, pickFolderAndWait]);

  const resetDashboard = useCallback((key) => {
    if (key === 'riepilogo') {
      setLayouts(prev => ({ ...prev, riepilogo: buildDefaultLayouts(getAvailWidth()).riepilogo }));
      setPeriod({ mese: null, anno: 2026 });
      pushToast('Riepilogo ripristinato');
    } else if (key === 'entrate') {
      setIncomes(DEFAULT_INCOMES);
      setExtraEntrate([]);
      pushToast('Entrate ripristinate ai valori di base');
    } else if (key === 'movimenti') {
      setMovements([]);
      setRevolutFiles([]);
      setMovimentiSkipped([]);
      pushToast('Tabella movimenti svuotata');
    } else if (key === 'fido') {
      setFido(defaultFido());
      pushToast('Fido azzerato');
    } else if (key === 'investimenti') {
      setInvestments({ massimiliano: [], giulia: [], cristiano: [], alessandro: [], mamma: [] });
      pushToast('Tutti i titoli sono stati azzerati');
    } else if (key === 'pensione') {
      setPensione({ dataInizio: '', importoMensile: 0, anniInvestimento: 0, ral: 0, saldoAttuale: 0 });
      pushToast('Campi pensione azzerati');
    } else if (key === 'finanziamenti') {
      setFinanziamenti(defaultFinanziamenti());
      pushToast('Elenco finanziamenti e mutui ripristinato ai valori di base');
    } else if (key === 'agenda') {
      setAgenda([]);
      pushToast('Agenda spese svuotata');
    } else if (key === 'cedolini') {
      setCedolini([]);
      setDocFiscali([]);
      pushToast('Buste paga e documenti fiscali azzerati (la cartella collegata resta)');
    } else if (key === 'analisiSpese') {
      setLayouts(prev => ({ ...prev, analisiSpese: buildDefaultLayouts(getAvailWidth()).analisiSpese }));
      pushToast('Analisi Spese ripristinata');
    }
  }, [pushToast, movements]);

  const ctx = { period, setPeriod, incomes, setIncomes, extraEntrate, setExtraEntrate, movements, setMovements, investments, setInvestments, pensione, setPensione, fido, setFido, finanziamenti, setFinanziamenti, agenda, setAgenda, cedolini, setCedolini, docFiscali, setDocFiscali, cedoliniScanStatus, cedoliniScanProgress, cedoliniLastScan, runLocalCedoliniScan, layouts, setLayouts, toasts, setToasts, pushToast, resetDashboard, marketData, refreshMarketData, isRefreshingPrices, overrideTicker, clearTickerOverride, saveProgress, lastSaved, driveClientId, setDriveClientId, driveFileInfo, driveConnected, driveStatus, gsiReady, connectDrive, disconnectDrive, forgetDriveFolder, getDriveAccessToken, view, setView, geminiApiKey, setGeminiApiKey, aiMessages, aiOpen, setAiOpen, aiLoading, aiSpeaking, setAiSpeaking, runAiChat, clearAiChat, installPromptEvent, triggerInstall, isIos, isStandalone, viewingFile, setViewingFile, revolutFiles, setRevolutFiles, movimentiSkipped, setMovimentiSkipped, entrateMovements, setEntrateMovements, numeroComponenti, setNumeroComponenti, liquiditaAttuale, setLiquiditaAttuale,
    cedoliniFolderInputRef, setteTrentaFolderInputRef, finecoFolderInputRef, revolutFolderInputRef, entrateFolderInputRef,
    movimentiFolderScanStatus, movimentiFolderScanProgress, movimentiFolderLastScan, refreshMovimentiFolders,
    entrateScanStatus, entrateScanProgress, entrateLastScan, importEntrateRows,
    runAggiornaTutteLeCartelle };

  let Dashboard;
  if (view === 'riepilogo') Dashboard = RiepilogoDashboard;
  else if (view === 'entrate') Dashboard = EntrateDashboard;
  else if (view === 'agenda') Dashboard = AgendaDashboard;
  else if (view === 'cedolini') Dashboard = CedoliniDashboard;
  else if (view === 'finanziamenti') Dashboard = FinanziamentiDashboard;
  else if (view === 'movimenti') Dashboard = MovimentiDashboard;
  else if (view === 'fidoDash') Dashboard = FidoDashboard;
  else if (view === 'analisiSpese') Dashboard = AnalisiSpeseDashboard;
  else if (view === 'investimenti') Dashboard = InvestimentiDashboard;
  else Dashboard = PensioneDashboard;

  return (
    <AppCtx.Provider value={ctx}>
      <div className="flex flex-col min-h-screen">
        <TopBar view={view} onOpenCommandBar={() => setCommandBarOpen(true)} />
        <main className={"flex-1 min-w-0 overflow-x-auto pb-28 " + (isMobile ? "px-3 py-4" : "px-6 py-6")}>
          <Dashboard />
        </main>
        <FloatingDock view={view} setView={setView} />
        <CommandBar open={commandBarOpen} onClose={() => setCommandBarOpen(false)} setView={setView} />
      </div>
      <input ref={cedoliniFolderInputRef} type="file" webkitdirectory="" directory="" multiple className="hidden"
        onChange={(e) => { const files = e.target.files; e.target.value = ''; runLocalCedoliniScan(files); }} />
      <input ref={setteTrentaFolderInputRef} type="file" webkitdirectory="" directory="" multiple className="hidden"
        onChange={(e) => { const files = e.target.files; e.target.value = ''; runLocalCedoliniScan(files); }} />
      <input ref={finecoFolderInputRef} type="file" webkitdirectory="" directory="" multiple className="hidden"
        onChange={(e) => { const files = e.target.files; e.target.value = ''; runFinecoLocalScan(files); }} />
      <input ref={revolutFolderInputRef} type="file" webkitdirectory="" directory="" multiple className="hidden"
        onChange={(e) => { const files = e.target.files; e.target.value = ''; runRevolutLocalScan(files); }} />
      <input ref={entrateFolderInputRef} type="file" webkitdirectory="" directory="" multiple className="hidden"
        onChange={(e) => { const files = e.target.files; e.target.value = ''; runEntrateFolderScan(files); }} />
      <ToastStack />
      <AiAssistantWidget />
      <FileViewerModal />
    </AppCtx.Provider>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, info) {
    console.error('Errore applicazione:', error, info);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, background: '#fafafa', fontFamily: 'system-ui, sans-serif' }}>
          <div style={{ maxWidth: 480, textAlign: 'center' }}>
            <p style={{ fontSize: 40, marginBottom: 8 }}>⚠️</p>
            <h1 style={{ fontSize: 20, fontWeight: 700, color: '#18181b', marginBottom: 8 }}>Si è verificato un errore</h1>
            <p style={{ fontSize: 14, color: '#71717a', marginBottom: 20, lineHeight: 1.5 }}>
              Qualcosa non ha funzionato nell'app. I tuoi dati salvati non sono stati toccati. Prova a ricaricare la pagina.
            </p>
            <button onClick={() => window.location.reload()} style={{ padding: '10px 20px', borderRadius: 8, background: '#18181b', color: '#fff', border: 'none', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>
              Ricarica la pagina
            </button>
            <p style={{ fontSize: 11, color: '#a1a1aa', marginTop: 16 }}>{String((this.state.error && this.state.error.message) || '')}</p>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
