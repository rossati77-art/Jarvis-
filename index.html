<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext } from 'react';

/* ============================== UTILS ============================== */

const MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const ANNI = [2024,2025,2026,2027];

function fmtEUR(n) {
  const v = Number.isFinite(n) ? n : 0;
  return new Intl.NumberFormat('it-IT', { style:'currency', currency:'EUR', maximumFractionDigits:2, useGrouping:'always' }).format(v);
}
function fmtPct(n) {
  const v = Number.isFinite(n) ? n : 0;
  return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
}
function fmtNum(n, d=2) {
  const v = Number.isFinite(n) ? n : 0;
  return new Intl.NumberFormat('it-IT', { minimumFractionDigits:d, maximumFractionDigits:d, useGrouping:'always' }).format(v);
}
function uid() { return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

const PWA_ICON_SVG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
  '<rect width="100" height="100" rx="22" fill="#18181b"/>' +
  '<path d="M50 18 L82 44 L82 84 L60 84 L60 60 L40 60 L40 84 L18 84 L18 44 Z" fill="#ffffff"/>' +
  '</svg>'
);

function parseImporto(raw) {
  if (typeof raw === 'number') return raw;
  if (raw === null || raw === undefined) return null;
  let s = String(raw).trim().replace(/[€\s]/g,'');
  if (!s) return null;
  const neg = /^-/.test(s) || /^\(.*\)$/.test(s);
  s = s.replace(/[()\-+]/g,'');
  if (!/\d/.test(s)) return null;
  if (s.includes(',') && s.includes('.')) {
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',', '.');
    else s = s.replace(/,/g,'');
  } else if (s.includes(',')) {
    s = s.replace(',', '.');
  }
  const n = parseFloat(s);
  if (Number.isNaN(n)) return null;
  return neg ? -Math.abs(n) : n;
}
function parseData(raw) {
  if (!raw) return null;
  const s = String(raw).trim();
  let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
function isExcelSerialDate(v) {
  const n = Number(v);
  return Number.isFinite(n) && n > 20000 && n < 60000;
}
function excelSerialToISO(serial) {
  const n = Number(serial);
  if (!Number.isFinite(n)) return null;
  const ms = Math.round((n - 25569) * 86400 * 1000);
  const d = new Date(ms);
  if (Number.isNaN(d.getTime())) return null;
  const y = d.getUTCFullYear(), mo = String(d.getUTCMonth()+1).padStart(2,'0'), da = String(d.getUTCDate()).padStart(2,'0');
  return `${y}-${mo}-${da}`;
}
function anyDateLikeToISO(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return isExcelSerialDate(v) ? excelSerialToISO(v) : null;
  const s = String(v).trim();
  if (!s || s === '-') return null;
  if (/^\d+(\.\d+)?$/.test(s)) return isExcelSerialDate(Number(s)) ? excelSerialToISO(Number(s)) : null;
  return parseData(s);
}
function isinLike(s) {
  return /^[A-Z]{2}[A-Z0-9]{9}[0-9]$/.test(String(s || '').trim().toUpperCase());
}
function inPeriod(dateStr, period) {
  if (!dateStr) return false;
  const [y, m] = dateStr.split('-');
  if (Number(y) !== period.anno) return false;
  if (period.mese === null) return true;
  return Number(m) === period.mese;
}

function classificaEntrata(descrizioneRaw) {
  const d = (descrizioneRaw || '').toLowerCase();
  // Datori di lavoro riconosciuti per nome: più precisi dei generici "stipendio/retribuzione".
  if (/eurofood/.test(d)) return 'Stipendio Massimiliano';
  if (/crisby/.test(d)) return 'Stipendio Susj';
  if (/stipendio|retribuzion|competenz/.test(d)) return 'Stipendio';
  if (/pensione|\binps\b/.test(d)) return 'Pensione / INPS';
  if (/rimborso/.test(d)) return 'Rimborso';
  if (/interess|cedola|dividend/.test(d)) return 'Interessi / Dividendi';
  if (/bonifico/.test(d)) return 'Bonifico ricevuto';
  return 'Altra entrata';
}

// Se sono presenti movimenti reali (dalla cartella Entrate dedicata, o in mancanza di quella dai
// movimenti Fineco/Revolut condivisi con Movimenti) con importo positivo, le entrate del periodo si
// calcolano solo da quelli, senza contare gli stipendi fissi impostati a mano (altrimenti si
// conterebbero due volte). I movimenti di borsa/investimento (vendite titoli, dividendi reinvestiti,
// ecc.) sono esclusi: non sono entrate "di reddito" ma spostamenti di capitale già investito.
function computeEntrate(incomes, extraEntrate, movements, entrateMovements, period) {
  const sorgente = (entrateMovements && entrateMovements.length > 0) ? entrateMovements : movements;
  const movimentiEntrata = sorgente.filter(m => Number(m.importo) > 0 && m.categoria !== 'investimento');
  if (movimentiEntrata.length > 0) {
    const filtrati = movimentiEntrata
      .filter(m => inPeriod(m.data, period))
      .map(m => ({ ...m, tipoEntrata: m.tipoEntrata || classificaEntrata(m.descrizione) }));
    return { mode: 'movimenti', totale: filtrati.reduce((s, m) => s + Number(m.importo), 0), movimenti: filtrati };
  }
  const base = Object.values(incomes).reduce((s, v) => s + (Number(v) || 0), 0)
    + extraEntrate.reduce((s, e) => s + (Number(e.importo) || 0), 0);
  return { mode: 'fisse', totale: period.mese === null ? base * 12 : base, movimenti: [] };
}

// Proiezione di cassa: stima (non una garanzia) di quando la liquidità disponibile potrebbe esaurirsi,
// combinando la spesa media reale degli ultimi 60 giorni (dai Movimenti) con gli impegni certi e datati
// (rate finanziamenti attivi, voci Agenda non ancora pagate) e le entrate fisse mensili impostate in Entrate.
function computeCashFlowForecast({ liquiditaAttuale, movements, incomes, finanziamenti, agenda, horizonDays = 180 }) {
  const oggi = new Date(); oggi.setHours(0, 0, 0, 0);
  const finestraStorica = 60;
  const dataInizioStorico = new Date(oggi); dataInizioStorico.setDate(dataInizioStorico.getDate() - finestraStorica);

  const speseStoriche = movements
    .filter(m => {
      const d = new Date(m.data);
      return !Number.isNaN(d.getTime()) && d >= dataInizioStorico && d <= oggi && EXPENSE_CATS.includes(m.categoria) && Number(m.importo) < 0;
    })
    .reduce((s, m) => s + Math.abs(Number(m.importo)), 0);
  const spesaMediaGiornaliera = speseStoriche / finestraStorica;

  const entrateMensiliFisse = (Number(incomes.massimiliano) || 0) + (Number(incomes.susj) || 0) + (Number(incomes.inps) || 0);
  const entrataMediaGiornaliera = entrateMensiliFisse / 30;

  const rateMensiliTot = finanziamenti.filter(f => f.attivo).reduce((s, f) => s + (Number(f.rataMensile) || 0), 0);
  const rataMediaGiornaliera = rateMensiliTot / 30;

  const agendaFutura = (agenda || [])
    .filter(a => !a.pagato && a.scadenza)
    .map(a => ({ data: a.scadenza, importo: Number(a.importo) || 0 }))
    .filter(a => { const d = new Date(a.data); return !Number.isNaN(d.getTime()) && d >= oggi; });

  let saldo = Number(liquiditaAttuale) || 0;
  let zeroDate = null;
  let minSaldo = saldo;
  let minSaldoData = oggi.toISOString().slice(0, 10);
  let saldoGiorno30 = saldo, saldoGiorno90 = saldo;
  for (let i = 0; i <= horizonDays; i++) {
    const dataCorrente = new Date(oggi); dataCorrente.setDate(dataCorrente.getDate() + i);
    const isoCorrente = dataCorrente.toISOString().slice(0, 10);
    if (i > 0) {
      saldo += entrataMediaGiornaliera - spesaMediaGiornaliera - rataMediaGiornaliera;
      for (const s of agendaFutura) { if (s.data === isoCorrente) saldo -= s.importo; }
    }
    if (saldo < minSaldo) { minSaldo = saldo; minSaldoData = isoCorrente; }
    if (zeroDate === null && saldo < 0) zeroDate = isoCorrente;
    if (i === 30) saldoGiorno30 = saldo;
    if (i === 90) saldoGiorno90 = saldo;
  }

  return {
    zeroDate,
    giorniAllaSoglia: zeroDate ? Math.round((new Date(zeroDate) - oggi) / 86400000) : null,
    entrataMediaGiornaliera, spesaMediaGiornaliera, rataMediaGiornaliera,
    saldoGiorno30, saldoGiorno90, minSaldo, minSaldoData,
    agendaFuturaCount: agendaFutura.length,
  };
}

// Cross-check fiscale: cerca nelle descrizioni dei Movimenti reali pattern che corrispondono a spese
// tipicamente detraibili/deducibili in dichiarazione dei redditi (sanitarie, istruzione, ristrutturazione,
// veterinarie, assicurazioni vita/infortuni). Sono candidati da verificare con un commercialista o CAF:
// non è un calcolo fiscale certificato né tiene conto di tutti i requisiti/massimali di legge.
const DEDUCIBILE_PATTERNS = [
  { id:'sanitarie', label:'Spese Sanitarie', regex:/farmacia|parafarmacia|dentist|dottor|medic[oi]|ospedal|laborator|analisi clinich|ottica|lenti a contatto|fisioterap|osteopat/i,
    note:'Detrazione IRPEF 19% sulla parte che supera la franchigia di 129,11€/anno.' },
  { id:'scuola', label:'Istruzione', regex:/retta scolastic|tassa universit|tasse universitarie|iscrizione scolastica|iscrizione universit|retta asilo/i,
    note:'Potenziale detrazione/deduzione per spese di istruzione scolastica o universitaria, entro i limiti di legge.' },
  { id:'ristrutturazione', label:'Ristrutturazione Edilizia', regex:/ristrutturazion|impresa edil|lavori edili/i,
    note:'Potenziale detrazione edilizia (es. Bonus Ristrutturazioni), soggetta a requisiti e massimali specifici.' },
  { id:'veterinarie', label:'Spese Veterinarie', regex:/veterinari/i,
    note:'Detrazione IRPEF 19% sulla parte eccedente 129,11€, entro il tetto massimo di spesa previsto.' },
  { id:'assicurazioni', label:'Assicurazioni Vita/Infortuni', regex:/assicurazione vita|polizza vita|assicurazione infortuni|polizza infortuni/i,
    note:'Potenziale detrazione 19% sui premi vita/infortuni, entro i massimali di legge.' },
];
function computeDeducibiliCandidati(movements) {
  const gruppi = {};
  for (const m of movements || []) {
    if (Number(m.importo) >= 0) continue;
    const desc = m.descrizione || '';
    const anno = (m.data || '').slice(0, 4);
    if (!anno) continue;
    for (const pat of DEDUCIBILE_PATTERNS) {
      if (!pat.regex.test(desc)) continue;
      const key = pat.id + '|' + anno;
      if (!gruppi[key]) gruppi[key] = { id: pat.id, label: pat.label, note: pat.note, anno, totale: 0, count: 0 };
      gruppi[key].totale += Math.abs(Number(m.importo));
      gruppi[key].count += 1;
      break;
    }
  }
  return Object.values(gruppi).sort((a, b) => (b.anno - a.anno) || (b.totale - a.totale));
}

const CATEGORY_META = {
  spesa:         { label: 'Alimentari',          dot: 'bg-amber-400',   badge: 'bg-amber-500/10 text-amber-300 border-amber-500/30' },
  ristorazione:  { label: 'Ristoranti & Viaggi',  dot: 'bg-orange-400',  badge: 'bg-orange-50 text-orange-700 border-orange-200' },
  svago:         { label: 'Svago & Sport',        dot: 'bg-violet-400',  badge: 'bg-violet-500/10 text-violet-300 border-violet-500/30' },
  bolletta:      { label: 'Bollette & Tecnologia',dot: 'bg-sky-400',     badge: 'bg-sky-500/10 text-sky-300 border-sky-500/30' },
  casa:          { label: 'Casa',                 dot: 'bg-emerald-400', badge: 'bg-emerald-500/10 text-emerald-300 border-emerald-500/30' },
  mutuo:         { label: 'Mutui & Assicurazioni',dot: 'bg-lime-500',    badge: 'bg-lime-50 text-lime-700 border-lime-200' },
  trasporti:     { label: 'Trasporti',            dot: 'bg-cyan-500',    badge: 'bg-cyan-50 text-cyan-700 border-cyan-200' },
  salute:        { label: 'Salute & Bellezza',    dot: 'bg-pink-400',    badge: 'bg-pink-50 text-pink-700 border-pink-200' },
  abbigliamento: { label: 'Abbigliamento',        dot: 'bg-fuchsia-400', badge: 'bg-fuchsia-50 text-fuchsia-700 border-fuchsia-200' },
  ecommerce:     { label: 'E-commerce & Altro',   dot: 'bg-slate-400',   badge: 'bg-slate-50 text-slate-700 border-slate-200' },
  tasse:         { label: 'Tasse & Tributi',      dot: 'bg-red-500',     badge: 'bg-red-50 text-red-700 border-red-200' },
  contanti:      { label: 'Prelievi Contanti',    dot: 'bg-neutral-400', badge: 'bg-white/5 text-zinc-200 border-white/10' },
  carta:         { label: 'Carta di Credito',     dot: 'bg-rose-400',    badge: 'bg-rose-500/10 text-rose-300 border-rose-500/30' },
  revolut:       { label: 'Flussi Revolut',       dot: 'bg-indigo-400',  badge: 'bg-indigo-500/10 text-indigo-300 border-indigo-500/30' },
  investimento:  { label: 'Investimento',         dot: 'bg-teal-400',    badge: 'bg-teal-500/10 text-teal-300 border-teal-500/30' },
};
const EXPENSE_CATS = ['spesa','ristorazione','svago','bolletta','casa','mutuo','trasporti','salute','abbigliamento','ecommerce','tasse','contanti','carta'];

function categorizza(descrizioneRaw) {
  const d = (descrizioneRaw || '').toLowerCase();
  if (/revolut/.test(d)) return 'revolut';
  if (/compravendita titoli|dossier titoli|riten\.?\s*etf|ritenuta su cedole|riten\.?\s*divid|isin|titoli|azioni|eseguito ordine|acquisto fondo|vendita fondo|\bborsa\b|comparto|\betf\b/.test(d)) return 'investimento';
  // Rate di mutuo/finanziamento: nell'estratto conto reale compaiono spesso come "PAGAMENTO RATA FIN." o
  // "RAPPORTI INTERNI...RATA FIN." (abbreviazione di "finanziamento"), non con la parola intera.
  if (/pagamento rata|rata\s*fin\b|rata mutuo|rata prestito|rata finanziamento|\bmutuo\b|\bprestito\b|finanziamento|assicurazione|\bpolizza\b|mutui, finanziamenti/.test(d)) return 'mutuo';
  if (/carta di credito|carta credito|addebito carta|pagamento carta|utilizzo carta/.test(d)) return 'carta';
  if (/prelievo|bancomat|\batm\b/.test(d)) return 'contanti';
  if (/enel|eni gas|\bgas\b|\bluce\b|\bacqua\b|telecom|\btim\b|vodafone|\bwind\b|\btre\b|fastweb|ho[\s.-]?mobile|kena|very mobile|iliad|postemobile|spusu|ricarica telefonic|bolletta|utenza|internet telefono e tecnologia/.test(d)) return 'bolletta';
  // Intermediari di pagamento (rateizzazione, wallet online): non indicano da soli il tipo di acquisto,
  // quindi non vanno mai confusi con "Alimentari" solo perché non c'è nessun'altra parola chiave riconosciuta.
  if (/scalapay|\bklarna\b|satispay|\bpaypal\b/.test(d)) return 'ecommerce';
  if (/ristorante|trattoria|osteria|pizzeria|\bbar\b|hotel|albergo|\bvolo\b|ryanair|easyjet|trenitalia|\bitalo\b|booking|airbnb|holiday|hotel ristoranti e viaggi|mc\s?donald|\bkfc\b|sushi|kebab|takeaway/.test(d)) return 'ristorazione';
  if (/netflix|spotify|cinema|svago|prime video|disney|steam|palestra|piscina|sport|giochi cultura e spettacoli/.test(d)) return 'svago';
  if (/farmacia|parafarmacia|\bmedico\b|dentista|\bottica\b|estetista|parrucchiere|salute e bellezza/.test(d)) return 'salute';
  if (/\bzara\b|\bh&m\b|abbigliamento|\bscarpe\b|calzature/.test(d)) return 'abbigliamento';
  if (/benzina|carburante|autostrada|\btreno\b|autobus|\btaxi\b|\buber\b|parcheggio|\bavis\b|\bhertz\b|\bsixt\b|rent\s?a\s?car|\btrasporti\b/.test(d)) return 'trasporti';
  if (/amazon|\bebay\b|e-commerce|ecommerce|altre spese/.test(d)) return 'ecommerce';
  if (/affitto|condominio|ristrutturazione/.test(d)) return 'casa';
  if (/\btasse\b|tributi|\bf24\b|agenzia entrate|tasse e tributi/.test(d)) return 'tasse';
  if (/migross|esselunga|\bcoop\b|\bconad\b|carrefour|\blidl\b|eurospin|\bpam\b|iperal|despar|\bsimply\b|\bmd\b discount|\bin'?s\b|\btigre\b|famila|\bsigma\b|\bpenny\b|supermercat/.test(d)) return 'spesa';
  return 'ecommerce';
}

const MONEYMAP_TO_CAT = {
  'alimentari': 'spesa',
  'hotel ristoranti e viaggi': 'ristorazione',
  'altre spese': 'ecommerce',

function movementKey(m) {
  const desc = (m.descrizione || '').toLowerCase().replace(/\s+/g, ' ').trim().slice(0, 90);
  const amt = Math.round((m.importo || 0) * 100);
  return `${m.data}__${amt}__${desc}`;
}

function calcolaIRPEF(reddito) {
  const r = Math.max(0, reddito || 0);
  if (r <= 28000) return r * 0.23;
  if (r <= 50000) return 28000*0.23 + (r-28000)*0.35;
  return 28000*0.23 + 22000*0.35 + (r-50000)*0.43;
}
function buildProiezionePensione(importoMensile, anni) {
  const rate = Math.pow(1.04, 1/12) - 1;
  let capitale = 0, versato = 0;
  const punti = [{ anno: 0, capitale: 0, versato: 0 }];
  const n = Math.max(0, Math.round(anni));
  for (let m = 1; m <= n*12; m++) {
    capitale = capitale * (1 + rate) + importoMensile;
    versato += importoMensile;
    if (m % 12 === 0) punti.push({ anno: m/12, capitale, versato });
  }
  return punti;
}
// Stima (non il saldo reale, che dipende dai rendimenti effettivi del fondo) di quanto dovrebbe valere
// oggi il fondo, versando importoMensile ogni mese da dataInizio ad oggi, con la stessa crescita
// ipotizzata (4% annuo) usata per la proiezione futura.
function stimaSaldoAttualePensione(importoMensile, dataInizio) {
  if (!importoMensile || !dataInizio) return 0;
  const inizio = new Date(dataInizio);
  if (Number.isNaN(inizio.getTime())) return 0;
  const mesiTrascorsi = Math.max(0, Math.floor((Date.now() - inizio.getTime()) / (30.4375 * 24 * 3600 * 1000)));
  const rate = Math.pow(1.04, 1/12) - 1;
  let capitale = 0;
  for (let m = 1; m <= mesiTrascorsi; m++) capitale = capitale * (1 + rate) + importoMensile;
  return capitale;
}

const LAYOUT_SCHEMA_VERSION = 4; /* bump quando cambia la struttura di buildDefaultLayouts, per forzare un reset pulito del layout salvato */

function healLayouts(saved, savedVersion) {
  const defaults = buildDefaultLayouts(getAvailWidth());
  if (!saved || typeof saved !== 'object' || savedVersion !== LAYOUT_SCHEMA_VERSION) return defaults;
  const merged = {};
  for (const key of Object.keys(defaults)) {
    if (Array.isArray(saved[key]) && saved[key].length > 0) {
      const existingIds = new Set(saved[key].map(w => w.id));
      const missingWidgets = defaults[key].filter(w => !existingIds.has(w.id));
      merged[key] = missingWidgets.length > 0 ? [...saved[key], ...missingWidgets] : saved[key];
    } else {
      merged[key] = defaults[key];
    }
  }
  return merged;
}

function DonutChart({ data, size=150 }) {
  const total = data.reduce((s,d)=>s+Math.max(0,d.value),0) || 1;
  const segments = useMemo(() => {
    let acc = 0;
    return data.map(d => {
      const frac = Math.max(0,d.value) / total;
      const seg = { ...d, frac, offset: acc };
      acc += frac;
      return seg;
    });
  }, [data, total]);
  const R = 40, C = 2*Math.PI*R;
  return (
    <div className="flex flex-col items-center justify-center h-full w-full gap-4">
      <svg viewBox="0 0 120 120" style={{ width: size, height: size }}>
        <g transform="translate(60,60) rotate(-90)">
          <circle r={R} fill="none" stroke="#f4f4f5" strokeWidth="16" />
          {segments.map((s,i) => (
            <circle key={i} r={R} fill="none" stroke={s.color} strokeWidth="16"
              strokeDasharray={`${s.frac*C} ${C - s.frac*C}`}
              strokeDashoffset={-s.offset*C}
              strokeLinecap="butt" />
          ))}
        </g>
        <text x="60" y="56" textAnchor="middle" fontSize="11" fontWeight="800" fill="#18181b">{fmtEUR(total)}</text>
        <text x="60" y="70" textAnchor="middle" fontSize="8" fill="#a1a1aa">Totale mensile</text>
      </svg>
      <div className="w-full grid grid-cols-1 gap-1.5 px-2">
        {data.map((d,i) => (
          <div key={i} className="flex items-center justify-between text-xs">
            <span className="flex items-center gap-2 text-zinc-300"><span className="w-2 h-2 rounded-full" style={{background:d.color}}></span>{d.label}</span>
            <span className="font-semibold text-zinc-100">{fmtEUR(d.value)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function LineChartSVG({ points, color='#4f46e5', valueKey='capitale', height=240 }) {
  const width = 640;
  const pad = 34;
  const maxY = Math.max(...points.map(p=>p[valueKey]), 1);
  const maxX = Math.max(...points.map(p=>p.anno), 1);
  const toX = (x) => pad + (x/maxX)*(width-pad*2);
  const toY = (y) => (height-pad) - (y/maxY)*(height-pad*2);
  const path = points.map((p,i) => `${i===0?'M':'L'} ${toX(p.anno).toFixed(1)} ${toY(p[valueKey]).toFixed(1)}`).join(' ');
  const areaPath = points.length ? `${path} L ${toX(points[points.length-1].anno).toFixed(1)} ${height-pad} L ${toX(points[0].anno).toFixed(1)} ${height-pad} Z` : '';
  const gridId = 'grad-' + valueKey;
  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height="100%" preserveAspectRatio="none" style={{ minHeight: 180 }}>
      <defs>
        <linearGradient id={gridId} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.28" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      {[0,0.25,0.5,0.75,1].map((t,i) => {
        const y = (height-pad) - t*(height-pad*2);
        return <line key={i} x1={pad} x2={width-pad} y1={y} y2={y} stroke="#f1f1f2" strokeWidth="1" />;
      })}
      <path d={areaPath} fill={`url(#${gridId})`} stroke="none" />
      <path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {points.map((p,i) => (
        <circle key={i} cx={toX(p.anno)} cy={toY(p[valueKey])} r="3.2" fill="white" stroke={color} strokeWidth="2" />
      ))}
      {points.map((p,i) => (
        (i===0 || i===points.length-1 || i % Math.ceil(points.length/6)===0) &&
        <text key={'t'+i} x={toX(p.anno)} y={height-8} textAnchor="middle" fontSize="9" fill="#a1a1aa">Anno {p.anno}</text>
      ))}
    </svg>
  );
}

/* ============================== DRAG / RESIZE GRID ENGINE ============================== */

function Widget({ dashKey, id, title, icon: Icon, layout, onLayoutChange, children, accent='text-zinc-400' }) {
  const dragRef = useRef(null);
  const resizeRef = useRef(null);

  const onDragMove = useCallback((e) => {
    if (!dragRef.current) return;
    const dx = e.clientX - dragRef.current.sx;
    const dy = e.clientY - dragRef.current.sy;
    onLayoutChange(id, { x: Math.max(0, dragRef.current.ox + dx), y: Math.max(0, dragRef.current.oy + dy) });
  }, [id, onLayoutChange]);
  const onDragEnd = useCallback(() => {
    dragRef.current = null;
    document.body.style.cursor = '';
    document.body.classList.remove('no-select');
    document.removeEventListener('mousemove', onDragMove);
    document.removeEventListener('mouseup', onDragEnd);
  }, [onDragMove]);
  const startDrag = (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    dragRef.current = { sx: e.clientX, sy: e.clientY, ox: layout.x, oy: layout.y };
    document.body.style.cursor = 'move';
    document.body.classList.add('no-select');
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
  };

  const onResizeMove = useCallback((e) => {
    if (!resizeRef.current) return;
    const dw = e.clientX - resizeRef.current.sx;
    const dh = e.clientY - resizeRef.current.sy;
    onLayoutChange(id, { w: Math.max(280, resizeRef.current.ow + dw), h: Math.max(160, resizeRef.current.oh + dh) });
  }, [id, onLayoutChange]);
  const onResizeEnd = useCallback(() => {
    resizeRef.current = null;
    document.body.style.cursor = '';
    document.body.classList.remove('no-select');
    document.removeEventListener('mousemove', onResizeMove);
    document.removeEventListener('mouseup', onResizeEnd);
  }, [onResizeMove]);
  const startResize = (e) => {
    e.preventDefault(); e.stopPropagation();
    resizeRef.current = { sx: e.clientX, sy: e.clientY, ow: layout.w, oh: layout.h };
    document.body.style.cursor = 'nwse-resize';
    document.body.classList.add('no-select');
    document.addEventListener('mousemove', onResizeMove);
    document.addEventListener('mouseup', onResizeEnd);
  };

  const accentBar = accent.replace('text-', 'bg-');
  return (
    <div style={{ position:'absolute', left: layout.x, top: layout.y, width: layout.w, height: layout.h }}
      className="app-card border border-white/10 rounded-2xl flex flex-col overflow-hidden fade-in">
      <div className={"h-[3px] w-full shrink-0 " + accentBar}></div>
      <div onMouseDown={startDrag} className="no-select flex items-center justify-between gap-2 px-4 py-3 border-b border-white/5 cursor-move bg-gradient-to-b from-white/[0.06] to-transparent shrink-0">
        <div className="flex items-center gap-2.5 min-w-0">
          <span className={"w-7 h-7 rounded-lg flex items-center justify-center shrink-0 bg-current/10 " + accent}>
            <Icon size={14} className={accent} />
          </span>
          <span className="text-sm font-semibold text-zinc-100 truncate">{title}</span>
        </div>
        <Icons.GripVertical size={14} className="text-zinc-600 shrink-0" />
      </div>
      <div className="flex-1 overflow-auto min-h-0">{children}</div>
      <div onMouseDown={startResize}
        className="absolute bottom-0 right-0 w-6 h-6 cursor-nwse-resize flex items-end justify-end p-1.5 text-zinc-600 hover:text-zinc-300 transition-colors">
        <Icons.Maximize2 size={12} />
      </div>
    </div>
  );
}

function useIsMobile(breakpoint) {
  const bp = breakpoint || 860;
  const [isMobile, setIsMobile] = useState(() => typeof window !== 'undefined' ? window.innerWidth < bp : false);
  useEffect(() => {
    if (typeof window === 'undefined') return;
    const mq = window.matchMedia(`(max-width: ${bp - 1}px)`);
    const handler = () => setIsMobile(mq.matches);
    handler();
    mq.addEventListener('change', handler);
    return () => mq.removeEventListener('change', handler);
  }, [bp]);
  return isMobile;
}

function GridCanvas({ dashKey, widgets, sections }) {
  const { layouts, setLayouts } = useApp();
  const isMobile = useIsMobile();
  const layout = layouts[dashKey] || buildDefaultLayouts(getAvailWidth())[dashKey] || [];
  const onLayoutChange = useCallback((id, patch) => {
    setLayouts(prev => ({ ...prev, [dashKey]: prev[dashKey].map(w => w.id === id ? { ...w, ...patch } : w) }));
  }, [dashKey, setLayouts]);

  if (isMobile) {
    const sectionMap = {};
    (sections || []).forEach(s => { sectionMap[s.id] = s; });
    let lastSection = null;
    return (
      <div className="flex flex-col gap-4 pb-8">
        {widgets.map(w => {
          const s = w.section ? sectionMap[w.section] : null;
          const showHeader = !!s && w.section !== lastSection;
          lastSection = w.section || lastSection;
          return (
            <React.Fragment key={w.id}>
              {showHeader && <div className="px-1 mt-1"><SectionDivider label={s.label} icon={s.icon} sub={s.sub} /></div>}
              <StackedWidget title={w.title} icon={w.icon} accent={w.accent}>{w.render}</StackedWidget>
            </React.Fragment>
          );
        })}
      </div>
    );
  }

  const height = Math.max(400, ...layout.map(w => w.y + w.h + 32));
  const width = Math.max(600, ...layout.map(w => w.x + w.w + 32));
  const sectionOf = {};
  widgets.forEach(w => { if (w.section) sectionOf[w.id] = w.section; });
  const sectionYs = {};
  layout.forEach(l => {
    const sid = sectionOf[l.id];
    if (!sid) return;
    if (sectionYs[sid] === undefined || l.y < sectionYs[sid]) sectionYs[sid] = l.y;
  });
  return (
    <div className="relative" style={{ height, width }}>
      {(sections || []).filter(s => sectionYs[s.id] !== undefined).map(s => (
        <div key={s.id} style={{ position:'absolute', left:0, top: sectionYs[s.id] - 38, width }}>
          <SectionDivider label={s.label} icon={s.icon} sub={s.sub} />
        </div>
      ))}
      {widgets.map(w => {
        const l = layout.find(x => x.id === w.id);
        if (!l) return null;
        return (
          <Widget key={w.id} dashKey={dashKey} id={w.id} title={w.title} icon={w.icon} accent={w.accent} layout={l} onLayoutChange={onLayoutChange}>
            {w.render}
          </Widget>
        );
      })}
    </div>
  );
}

function CommandBar({ open, onClose, setView }) {
  const { saveProgress, runAggiornaTutteLeCartelle, setAiOpen } = useApp();
  const [query, setQuery] = useState('');
  const [activeIdx, setActiveIdx] = useState(0);
  const inputRef = useRef(null);

  useEffect(() => {
    if (open) { setQuery(''); setActiveIdx(0); setTimeout(() => inputRef.current && inputRef.current.focus(), 30); }
  }, [open]);

  const actions = useMemo(() => [
    ...NAV_ITEMS.map(n => ({ id:'nav-'+n.key, label:n.label, icon:n.icon, group:'Naviga', run: () => setView(n.key) })),
    { id:'save', label:'Salva Progressi', icon:'Save', group:'Azioni', run: () => saveProgress() },
    { id:'refresh', label:'Aggiorna Tutte le Cartelle', icon:'RefreshCw', group:'Azioni', run: () => runAggiornaTutteLeCartelle() },
    { id:'ai', label:'Apri R.I.S.', icon:'Sparkles', group:'Azioni', run: () => setAiOpen(true) },
  ], [setView, saveProgress, runAggiornaTutteLeCartelle, setAiOpen]);

  const filtered = query.trim()
    ? actions.filter(a => a.label.toLowerCase().includes(query.trim().toLowerCase()))
    : actions;

  const runAction = (a) => { a.run(); onClose(); };

  const handleKeyDown = (e) => {
    if (e.key === 'Escape') { onClose(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); setActiveIdx(i => Math.min(filtered.length - 1, i + 1)); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); setActiveIdx(i => Math.max(0, i - 1)); return; }
    if (e.key === 'Enter') { e.preventDefault(); if (filtered[activeIdx]) runAction(filtered[activeIdx]); return; }
  };

  if (!open) return null;
  let lastGroup = null;
  return (
    <div className="fixed inset-0 z-[60] flex items-start justify-center pt-[10vh] px-4 bg-black/60" onClick={onClose}>
      <div className="w-full max-w-lg rounded-2xl border border-white/10 overflow-hidden" onClick={(e) => e.stopPropagation()}
        style={{ background:'linear-gradient(180deg, rgba(20,20,26,0.97), rgba(10,10,14,0.98))', backdropFilter:'blur(26px)', WebkitBackdropFilter:'blur(26px)', boxShadow:'0 0 0 1px rgba(99,102,241,0.18), 0 30px 70px -20px rgba(0,0,0,0.8)' }}>
        <div className="flex items-center gap-2.5 px-4 py-3 border-b border-white/5">
          <Icons.Search size={16} className="text-indigo-300 shrink-0" />
          <input ref={inputRef} value={query} onChange={(e) => { setQuery(e.target.value); setActiveIdx(0); }} onKeyDown={handleKeyDown}
            placeholder="Vai a una dashboard o esegui un'azione..."
            className="flex-1 min-w-0 bg-transparent text-sm text-zinc-100 placeholder-zinc-600 outline-none" />
          <kbd className="text-[10px] font-mono text-zinc-600 border border-white/10 rounded px-1.5 py-0.5 shrink-0">Esc</kbd>
        </div>
        <div className="max-h-[52vh] overflow-y-auto py-2">
          {filtered.length === 0 && <p className="px-4 py-6 text-center text-xs text-zinc-500">Nessun risultato.</p>}
          {filtered.map((a, i) => {
            const Icon = Icons[a.icon];
            const showGroup = a.group !== lastGroup;
            lastGroup = a.group;
            return (
              <React.Fragment key={a.id}>
                {showGroup && <p className="px-4 pt-2 pb-1 text-[10px] font-semibold text-zinc-600 uppercase tracking-wide">{a.group}</p>}
                <button onClick={() => runAction(a)} onMouseEnter={() => setActiveIdx(i)}
                  className={"w-full flex items-center gap-2.5 px-4 py-2 text-sm transition-colors " + (i === activeIdx ? "bg-indigo-500/15 text-zinc-50" : "text-zinc-300")}>
                  <Icon size={15} className={i === activeIdx ? "text-indigo-300" : "text-zinc-500"} />
                  {a.label}
                  {i === activeIdx && <Icons.CornerDownLeft size={12} className="ml-auto text-zinc-600 shrink-0" />}
                </button>
              </React.Fragment>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function computeFidoStats(fido) {
  const totale = Number(fido.totale) || 0;
  const versato = Math.min(totale, Math.max(0, Math.abs(Number(fido.saldoAttuale) || 0)));
  const mancante = Math.max(0, totale - versato);
  const pctMancante = totale > 0 ? Math.min(100, Math.max(0, (mancante / totale) * 100)) : 0;
  const pctVersato = totale > 0 ? Math.min(100, Math.max(0, (versato / totale) * 100)) : 0;
  const completato = totale > 0 && versato >= totale;
  return { totale, versato, mancante, pctMancante, pctVersato, completato };
}

function FidoProgressBar({ pct, completato }) {
  return (

        style={{ width: `${Math.max(3, pct)}%` }}></div>
    </div>
  );
}

  finanziamento: { label: 'Finanziamento', badge: 'bg-violet-500/10 text-violet-300 border-violet-500/30', dot: 'bg-violet-400' },
};

function computeFinanziamentiStats(items) {
  const attivi = items.filter(i => i.attivo);
  const estinti = items.filter(i => !i.attivo);
  const mutui = attivi.filter(i => i.tipo === 'mutuo');
  const finanziamenti = attivi.filter(i => i.tipo === 'finanziamento');
  const rataMutui = mutui.reduce((s,i) => s + (Number(i.rataMensile) || 0), 0);
  const rataFinanziamenti = finanziamenti.reduce((s,i) => s + (Number(i.rataMensile) || 0), 0);
  const rataTotale = rataMutui + rataFinanziamenti;
  const debitoResiduoTotale = attivi.reduce((s,i) => s + (Number(i.debitoResiduo) || 0), 0);
  return { attivi, estinti, mutui, finanziamenti, rataMutui, rataFinanziamenti, rataTotale, debitoResiduoTotale };
}

const MAX_RICEVUTA_BYTES = 3 * 1024 * 1024;
const MAX_DOC_FISCALE_BYTES = 10 * 1024 * 1024; /* ISEE/730 scansionati sono spesso più pesanti di una ricevuta */

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('Lettura file fallita'));
    reader.readAsDataURL(file);
  });
}

function computeAgendaStats(agenda, period) {
  const filtrati = agenda.filter(a => inPeriod(a.scadenza, period));
  const totale = filtrati.reduce((s,a) => s + (Number(a.importo) || 0), 0);
  const pagato = filtrati.filter(a => a.pagato).reduce((s,a) => s + (Number(a.importo) || 0), 0);
  const daPagare = Math.max(0, totale - pagato);
  return { filtrati, totale, pagato, daPagare, count: filtrati.length, countPagati: filtrati.filter(a=>a.pagato).length };
}

function AgendaSummaryCard() {
  const { agenda, period } = useApp();
  const { totale, pagato, daPagare, count } = computeAgendaStats(agenda, period);
  const label = period.mese === null ? `Anno ${period.anno}` : `${MESI[period.mese-1]} ${period.anno}`;
  return (
    <div className="h-full flex flex-col justify-between p-4">
      <div className="flex items-center justify-between">
        <div className="w-8 h-8 rounded-xl flex items-center justify-center bg-sky-500/15 text-sky-400">
          <Icons.Calendar size={16} />
        </div>
        <span className="text-[10.5px] font-semibold text-zinc-500">{count} voci · {label}</span>
      </div>
      <div>
        <p className="text-2xl font-bold text-zinc-50 tracking-tight">{fmtEUR(daPagare)}</p>
        <p className="text-xs text-zinc-400 mt-1">Da pagare in agenda</p>
        <p className="text-[11px] text-zinc-500 mt-0.5">Totale {fmtEUR(totale)} · Già pagato {fmtEUR(pagato)}</p>
      </div>
    </div>
  );
}

function AgendaRiepilogoWidget() {
  const { agenda, period } = useApp();

  const label = period.mese === null ? `tutto il ${period.anno}` : `${MESI[period.mese-1]} ${period.anno}`;

function agendaReceipts(a) {
  if (a.ricevute) return a.ricevute;
  return a.ricevuta ? [{ id: 'legacy', ...a.ricevuta }] : [];
}

function receiptFileIcon(ricevuta) {
  if (ricevuta.type && ricevuta.type.startsWith('image/')) return Icons.Image;
  if (ricevuta.type === 'application/pdf' || /\.pdf$/i.test(ricevuta.name || '')) return Icons.FileText;
  return Icons.File;
}

  const addItem = () => {
    const importo = parseImporto(nuovo.importo);
    if (!nuovo.nome.trim() || importo === null || !nuovo.scadenza) { pushToast('Compila nome, importo e scadenza.', 'warn'); return; }
    setAgenda(prev => [mkAgendaItem(nuovo.nome.trim(), importo, nuovo.scadenza), ...prev]);
    setNuovo({ nome:'', importo:'', scadenza:'' });
    pushToast('Voce aggiunta in agenda');

  const updateItem = (id, patch) => setAgenda(prev => prev.map(a => a.id === id ? { ...a, ...patch } : a));
  const togglePagato = (id) => updateItem(id, { pagato: !agenda.find(a=>a.id===id)?.pagato });
  const removeItem = (id) => {
    const removed = agenda.find(a => a.id === id);
    setAgenda(prev => prev.filter(a => a.id !== id));

function DocFiscaleUploadForm({ tipo, onSave }) {
  const { pushToast } = useApp();
  const [busy, setBusy] = useState(false);
  const handleFile = async (file) => {
    if (!file) return;
    if (file.size > MAX_DOC_FISCALE_BYTES) { pushToast(`File troppo grande (max ${(MAX_DOC_FISCALE_BYTES/1024/1024).toFixed(0)}MB). Se è una scansione pesante, prova a comprimerla o a fotografarla a risoluzione più bassa.`, 'error'); return; }
    setBusy(true);
    try {
      const buf = await file.arrayBuffer();
      const text = await extractFileText(buf, file.type, file.name);
      const parsed = text ? parseFiscaleText(text, tipo) : { confidence: 'bassa' };
      const dataUrl = await readFileAsDataUrl(file);
      onSave({
        id: uid(), tipo, fileName: file.name, ricevuta: { name: file.name, type: file.type, dataUrl },
        anno: parsed.anno || new Date().getFullYear(),
        valore: parsed.valore ?? null,
        redditoComplessivo: parsed.redditoComplessivo ?? null,
        impostaNetta: parsed.impostaNetta ?? null,
        esito: parsed.esito ?? null,
        importoEsito: parsed.importoEsito ?? null,
        needsManual: parsed.confidence !== 'buona',
      });
      pushToast(`${tipo} caricato${parsed.confidence === 'buona' ? '' : ' — controlla i valori estratti'}`, parsed.confidence === 'buona' ? 'ok' : 'warn');
    } catch (e) {
      pushToast('Impossibile leggere il file.', 'error');
    }
    setBusy(false);
  };
  return (
    <label className={"inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border border-dashed border-white/15 text-xs font-medium text-zinc-400 hover:text-zinc-100 hover:border-white/20 cursor-pointer transition-colors " + (busy ? "opacity-50 pointer-events-none" : "")}>
      <Icons.Upload size={13} /> {busy ? 'Lettura...' : `Carica ${tipo}`}
      <input type="file" accept=".pdf,image/*" className="hidden" onChange={(e) => { handleFile(e.target.files[0]); e.target.value = ''; }} />
    </label>
  );
}

function RiepilogoDashboard() {
  const { period, incomes, extraEntrate, movements, entrateMovements, investments, pensione, finanziamenti, agenda, resetDashboard } = useApp();

  const entrate = useMemo(() => computeEntrate(incomes, extraEntrate, movements, entrateMovements, period), [incomes, extraEntrate, movements, entrateMovements, period]);
  const entrateTot = entrate.totale;

  const movFiltered = useMemo(() => movements.filter(m => inPeriod(m.data, period)), [movements, period]);
  const uscite = useMemo(() => movFiltered.filter(m => EXPENSE_CATS.includes(m.categoria) && m.importo < 0).reduce((s,m) => s + Math.abs(m.importo), 0), [movFiltered]);

  // "Quanto resta davvero": stipendi fissi (Massimiliano + Susj + INPS) meno le rate di mutui/finanziamenti
  // attivi, meno le spese in Agenda non ancora pagate in scadenza nel periodo, meno le uscite reali già
  // registrate nei Movimenti nello stesso periodo (utile per i mesi passati, dove la spesa reale è nota:
  // le voci Agenda già pagate non vengono ricontate qui perché escluse sopra, e il loro pagamento reale
  // compare comunque tra le uscite dei Movimenti).
  const mesiNelPeriodo = period.mese === null ? 12 : 1;
  const stipendiFissi = useMemo(() =>
    ((Number(incomes.massimiliano)||0) + (Number(incomes.susj)||0) + (Number(incomes.inps)||0)) * mesiNelPeriodo,
    [incomes, mesiNelPeriodo]);
  const rateMensiliTot = useMemo(() =>
    finanziamenti.filter(f => f.attivo).reduce((s,f) => s + (Number(f.rataMensile)||0), 0) * mesiNelPeriodo,
    [finanziamenti, mesiNelPeriodo]);
  const agendaDaPagare = useMemo(() =>
    agenda.filter(a => !a.pagato && inPeriod(a.scadenza, period)),
    [agenda, period]);
  const agendaDaPagareTot = useMemo(() => agendaDaPagare.reduce((s,a) => s + (Number(a.importo)||0), 0), [agendaDaPagare]);
  const restaEffettivo = stipendiFissi - rateMensiliTot - agendaDaPagareTot - uscite;
  const restaPositivo = restaEffettivo >= 0;
  const cartaTot = useMemo(() => movFiltered.filter(m => m.categoria === 'carta').reduce((s,m) => s + Math.abs(m.importo), 0), [movFiltered]);
  const revolutTot = useMemo(() => movFiltered.filter(m => m.categoria === 'revolut').reduce((s,m) => s + Math.abs(m.importo), 0), [movFiltered]);

  const massValore = useMemo(() => investments.massimiliano.reduce((s,h) => s + h.quantita*h.prezzoCorrente, 0), [investments.massimiliano]);
  const massCosto = useMemo(() => investments.massimiliano.reduce((s,h) => s + h.quantita*h.pma, 0), [investments.massimiliano]);
  const massPL = massValore - massCosto;
  const massPLpct = massCosto > 0 ? (massPL/massCosto)*100 : 0;

  const pensioneProiezione = useMemo(() => buildProiezionePensione(Number(pensione.importoMensile)||0, Number(pensione.anniInvestimento)||0), [pensione]);
  const pensioneFinale = pensioneProiezione.length ? pensioneProiezione[pensioneProiezione.length-1].capitale : 0;

  const salvadanaio = entrateTot - uscite;
  const positivo = salvadanaio >= 0;

  const widgets = [
    { id:'restaEffettivo', title:'Quanto Resta Davvero', icon: Icons.Wallet, accent: restaPositivo ? 'text-emerald-500' : 'text-rose-500', render: (
      <div className="h-full flex flex-col justify-between p-4">
        <div className="flex items-center justify-between">
          <div className={"w-8 h-8 rounded-xl flex items-center justify-center " + (restaPositivo ? "bg-emerald-500/15 text-emerald-400" : "bg-rose-500/15 text-rose-400")}>
            <Icons.Wallet size={16} />
          </div>
          <span className="text-[10.5px] font-semibold text-zinc-500">{period.mese===null ? `Anno ${period.anno}` : `${MESI[period.mese-1]} ${period.anno}`}</span>
        </div>
        <div>
          <p className={"text-2xl font-bold tracking-tight " + (restaPositivo ? "text-emerald-400" : "text-rose-400")}>{fmtEUR(restaEffettivo)}</p>
          <p className="text-xs text-zinc-400 mt-1">Stipendi (Massimiliano + Susj + INPS) − rate mutui/finanziamenti − agenda da pagare − uscite reali dai movimenti</p>
          <div className="flex flex-wrap gap-x-3 gap-y-0.5 mt-1.5 text-[10.5px] text-zinc-500">
            <span>Stipendi {fmtEUR(stipendiFissi)}</span>
            <span>Rate {fmtEUR(rateMensiliTot)}</span>
            <span>Agenda {fmtEUR(agendaDaPagareTot)} ({agendaDaPagare.length})</span>
            <span>Movimenti {fmtEUR(uscite)}</span>
          </div>
        </div>
      </div>
    ) },
    { id:'cashflow', title:'Proiezione di Cassa', icon: Icons.Activity, accent:'text-indigo-500', render: <CashFlowForecastCard /> },
    { id:'entrate', title:'Entrate', icon: Icons.Wallet, accent:'text-emerald-500', section:'flussi', render: <StatCard icon={Icons.Wallet} tone="green" value={fmtEUR(entrateTot)} label="Entrate del periodo" sub={entrate.mode === 'movimenti' ? `${entrate.movimenti.length} accrediti da movimenti` : (period.mese===null ? 'Somma annua stimata (valori fissi)' : 'Stipendi fissi + INPS')} /> },
    { id:'uscite', title:'Uscite', icon: Icons.TrendingDown, accent:'text-rose-500', section:'flussi', render: <StatCard icon={Icons.TrendingDown} tone="red" value={fmtEUR(uscite)} label="Spese reali (esclusi investimenti)" sub={`${movFiltered.filter(m=>EXPENSE_CATS.includes(m.categoria)).length} movimenti`} /> },
    { id:'investimenti', title:'Andamento Investimenti', icon: Icons.TrendingUp, accent:'text-violet-500', section:'patrimonio', render: <StatCard icon={Icons.TrendingUp} tone="violet" value={fmtEUR(massValore)} label="Valore di mercato (Fineco + Lombard)" sub={`P&L ${fmtEUR(massPL)}`} trend={massPLpct} /> },
    { id:'carta', title:'Carta di Credito', icon: Icons.CreditCard, accent:'text-rose-500', section:'impegni', render: <StatCard icon={Icons.CreditCard} tone="red" value={fmtEUR(cartaTot)} label="Addebiti carta del mese" /> },
    { id:'revolut', title:'Flussi Revolut', icon: Icons.RefreshCw, accent:'text-indigo-500', section:'impegni', render: <StatCard icon={Icons.RefreshCw} tone="indigo" value={fmtEUR(revolutTot)} label="Giroconti verso Revolut" sub="Alimenti & Ludico" /> },
    { id:'pensione', title:'Seconda Pensione', icon: Icons.ShieldCheck, accent:'text-amber-500', section:'patrimonio', render: <StatCard icon={Icons.ShieldCheck} tone="amber" value={fmtEUR(Number(pensione.saldoAttuale)||0)} label="Saldo attuale del fondo" sub={`Proiezione a ${pensione.anniInvestimento} anni: ${fmtEUR(pensioneFinale)}`} /> },
    { id:'salvadanaio', title:'Salvadanaio', icon: Icons.PiggyBank, accent: positivo ? 'text-emerald-500' : 'text-rose-500', section:'flussi', render: (
      <div className="h-full flex flex-col justify-between p-4">
        <div className="flex items-center justify-between">
          <div className={"w-8 h-8 rounded-xl flex items-center justify-center " + (positivo ? "bg-emerald-500/15 text-emerald-400" : "bg-rose-500/15 text-rose-400")}>
            <Icons.PiggyBank size={16} />
          </div>
          <span className={"px-2.5 py-1 rounded-full text-[11px] font-bold " + (positivo ? "bg-emerald-500/15 text-emerald-300" : "bg-rose-500/15 text-rose-300")}>
            {positivo ? 'IN POSITIVO' : 'ATTENZIONE'}
          </span>
        </div>
        <div>
          <p className={"text-2xl font-bold tracking-tight " + (positivo ? "text-emerald-400" : "text-rose-400")}>{fmtEUR(salvadanaio)}</p>
          <p className="text-xs text-zinc-400 mt-1">Entrate − Uscite del periodo</p>
          {!positivo && <p className="text-[11px] text-rose-500 mt-1 flex items-center gap-1"><Icons.AlertTriangle size={11}/> Le uscite superano le entrate</p>}
        </div>
      </div>
    ) },
    { id:'fido', title:'Fido da Recuperare', icon: Icons.Landmark, accent:'text-amber-500', section:'impegni', render: <FidoSummaryCard /> },
    { id:'finanziamenti', title:'Finanziamenti e Mutui', icon: Icons.Building2, accent:'text-indigo-500', section:'impegni', render: <FinanziamentiSummaryCard /> },
    { id:'agenda', title:'Spese in Agenda', icon: Icons.Calendar, accent:'text-sky-500', section:'impegni', render: <AgendaSummaryCard /> },
  ];

  const sections = [
    { id:'flussi', label:'I Flussi del Mese', icon: Icons.ArrowLeftRight, sub:'Entrate, uscite e risparmio del periodo' },
    { id:'patrimonio', label:'Patrimonio & Futuro', icon: Icons.TrendingUp, sub:'Investimenti e seconda pensione' },
    { id:'impegni', label:'Impegni & Spese Fisse', icon: Icons.CalendarClock, sub:'Carte, fido, finanziamenti e agenda' },
  ];

  return (
    <div>
      <DashboardHeader title="Riepilogo" subtitle="Vista d'insieme in tempo reale su tutte le dashboard" icon={Icons.LayoutDashboard}
        onReset={() => resetDashboard('riepilogo')} resetLabel="Ripristina il layout di default"
        extra={<><AggiornaTutteLeCartelleButton /><SaveProgressButton /></>} />
      <GridCanvas dashKey="riepilogo" widgets={widgets} sections={sections} />
    </div>
  );
}

const EXTRA_INCOME_COLORS = ['#ec4899', '#14b8a6', '#f97316', '#8b5cf6', '#22c55e', '#eab308', '#06b6d4', '#f43f5e'];

function EntrateDashboard() {
  const {
    incomes, setIncomes, extraEntrate, setExtraEntrate, movements, entrateMovements, period, setPeriod, setView, resetDashboard, pushToast,
    entrateFolderInputRef, entrateScanStatus, entrateScanProgress, entrateLastScan, importEntrateRows,
  } = useApp();
  const [newExtra, setNewExtra] = useState({ nome: '', importo: '' });
  const entrate = useMemo(() => computeEntrate(incomes, extraEntrate, movements, entrateMovements, period), [incomes, extraEntrate, movements, entrateMovements, period]);
  const entrateBreakdown = useMemo(() => {
    const order = ['Stipendio Massimiliano', 'Stipendio Susj', 'Pensione / INPS'];
    const byTipo = {};
    for (const m of entrate.movimenti) byTipo[m.tipoEntrata] = (byTipo[m.tipoEntrata] || 0) + Number(m.importo);
    return Object.entries(byTipo).sort((a, b) => {
      const ia = order.indexOf(a[0]), ib = order.indexOf(b[0]);
      if (ia !== -1 || ib !== -1) return (ia === -1 ? order.length : ia) - (ib === -1 ? order.length : ib);
      return b[1] - a[1];
    });
  }, [entrate.movimenti]);
  const voceBreakdown = useMemo(() => {
    if (entrate.mode === 'movimenti') return entrateBreakdown.map(([label, value]) => ({ label, value }));
    return [
      ...Object.keys(incomes).map(k => ({ label: INCOME_LABELS[k], value: Number(incomes[k]) || 0 })),
      ...extraEntrate.map(e => ({ label: e.nome || 'Altra entrata', value: Number(e.importo) || 0 })),
    ].filter(v => v.value > 0);
  }, [entrate.mode, entrateBreakdown, incomes, extraEntrate]);
  const maxVoce = Math.max(1, ...voceBreakdown.map(v => v.value));

  const handleEntrateFileRows = (rows, filename, error) => {
    if (error) { pushToast('Non riesco a leggere ' + filename + '.', 'error'); return; }
    const parsed = parseRowsToMovimenti(rows);
    if (parsed.length === 0) { pushToast('Nessun movimento riconosciuto in ' + filename + '.', 'warn'); return; }
    importEntrateRows(parsed, filename);
  };
  const handleEntrateMovimentiParsed = (parsed, filename) => {
    if (parsed.length === 0) { pushToast('Nessun movimento riconosciuto in ' + filename + '.', 'warn'); return; }
    importEntrateRows(parsed, filename);
  };

  const baseTot = Object.values(incomes).reduce((s,v)=>s+(Number(v)||0),0);
  const extraTot = extraEntrate.reduce((s,e)=>s+(Number(e.importo)||0),0);

  const addExtra = () => {
    const importo = parseImporto(newExtra.importo);
    if (!newExtra.nome.trim() || importo === null) { pushToast('Inserisci nome e importo della voce.', 'warn'); return; }
    setExtraEntrate(prev => [...prev, { id: uid(), nome: newExtra.nome.trim(), importo }]);
    setNewExtra({ nome: '', importo: '' });
  };
  const removeExtra = (id) => setExtraEntrate(prev => prev.filter(e => e.id !== id));
  const updateExtra = (id, patch) => setExtraEntrate(prev => prev.map(e => e.id === id ? { ...e, ...patch } : e));

  const widgets = [
    { id:'cartella', title:'Carica Entrate', icon: Icons.FolderInput, accent:'text-emerald-500', render: (
      <div className="p-4 flex flex-col gap-3">
        <Dropzone icon={Icons.FileSpreadsheet} label="Trascina un estratto conto" sub="CSV / XLSX / PDF con gli accrediti" onFilesRows={handleEntrateFileRows} onMovimentiParsed={handleEntrateMovimentiParsed} />
        <div className="pt-3 border-t border-white/5">
          {entrateLastScan ? (
            <PrimaryBtn onClick={() => entrateFolderInputRef.current && entrateFolderInputRef.current.click()} icon={Icons.RefreshCw} className="w-full justify-center" disabled={entrateScanStatus === 'scanning'}>
              {entrateScanStatus === 'scanning' ? 'Scansione in corso...' : 'Aggiorna Cartella Entrate'}
            </PrimaryBtn>
          ) : (
            <GhostBtn onClick={() => entrateFolderInputRef.current && entrateFolderInputRef.current.click()} icon={Icons.FolderInput} className="w-full justify-center" disabled={entrateScanStatus === 'scanning'}>
              {entrateScanStatus === 'scanning' ? 'Scansione in corso...' : 'Oppure importa una cartella intera'}
            </GhostBtn>
          )}
          {entrateScanStatus === 'scanning' && entrateScanProgress && <p className="text-[10.5px] text-zinc-500 truncate mt-1.5">Analizzando: {entrateScanProgress}</p>}
          {entrateScanStatus !== 'scanning' && entrateLastScan && <p className="text-[10.5px] text-zinc-500 mt-1.5">Ultimo controllo: {new Date(entrateLastScan).toLocaleTimeString('it-IT')}</p>}

const FINECO_HEADER_ALIASES = {
  dataOperazione: ['data_operazione', 'data operazione'],
  dataValuta: ['data_valuta', 'data valuta'],
  entrate: ['entrate'],
  uscite: ['uscite'],
  descrizione: ['descrizione'],
  descrizioneCompleta: ['descrizione_completa', 'descrizione completa'],
  stato: ['stato'],
  moneymap: ['moneymap', 'money map', 'categoria'],
};
function normHeaderCell(s) {
  return String(s || '').toLowerCase().trim().replace(/[_\s]+/g, ' ');
}
function detectFinecoHeaderRow(rows) {
  const limit = Math.min(rows.length, 30);
  for (let i = 0; i < limit; i++) {
    const row = rows[i] || [];
    const norm = row.map(normHeaderCell);
    const idxOf = (aliases) => norm.findIndex(c => aliases.includes(c));
    const descIdx = idxOf(FINECO_HEADER_ALIASES.descrizione);
    const usciteIdx = idxOf(FINECO_HEADER_ALIASES.uscite);
    if (descIdx !== -1 && usciteIdx !== -1) {
      return {
        rowIndex: i,
        dataOperazione: idxOf(FINECO_HEADER_ALIASES.dataOperazione),
        dataValuta: idxOf(FINECO_HEADER_ALIASES.dataValuta),
        entrate: idxOf(FINECO_HEADER_ALIASES.entrate),
        uscite: usciteIdx,
        descrizione: descIdx,
        descrizioneCompleta: idxOf(FINECO_HEADER_ALIASES.descrizioneCompleta),
        stato: idxOf(FINECO_HEADER_ALIASES.stato),
        moneymap: idxOf(FINECO_HEADER_ALIASES.moneymap),
      };
    }
  }
  return null;
}
function parseFinecoRows(rows, map) {
  const out = [];
  const get = (row, idx) => (idx === -1 || idx === undefined) ? undefined : row[idx];
  for (let i = map.rowIndex + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.length === 0) continue;
    const nEntrate = parseImporto(get(row, map.entrate));
    const nUscite = parseImporto(get(row, map.uscite));
    if (nEntrate === null && nUscite === null) continue;
    const importo = (nEntrate !== null && nEntrate !== 0) ? Math.abs(nEntrate) : (nUscite !== null ? -Math.abs(nUscite) : null);
    if (importo === null) continue;
    const dataISO = anyDateLikeToISO(get(row, map.dataOperazione)) || anyDateLikeToISO(get(row, map.dataValuta));
    if (!dataISO) continue;
    const descBase = String(get(row, map.descrizione) || '').trim();
    const descFull = String(get(row, map.descrizioneCompleta) || '').trim();
    const moneymap = String(get(row, map.moneymap) || '').trim().toLowerCase();
    const combined = (descBase + ' ' + descFull).toLowerCase();
    let categoria;
    if (/revolut/.test(combined)) categoria = 'revolut';
    else if (/compravendita titoli|dossier titoli|riten\.?\s*etf|ritenuta su cedole|riten\.?\s*divid/.test(combined)) categoria = 'investimento';
    else if (/carta di credito|carta credito|utilizzo carta/.test(combined)) categoria = 'carta';
    else if (MONEYMAP_TO_CAT[moneymap]) categoria = MONEYMAP_TO_CAT[moneymap];
    else categoria = categorizza(combined);
    const descrizioneFinale = (descFull && descFull.length > 2 ? descFull : (descBase || 'Movimento')).slice(0, 160);
    out.push({ id: uid(), data: dataISO, descrizione: descrizioneFinale, importo, categoria });
  }
  return out;
}
function parseRowsToMovimentiGeneric(rows) {
  const out = [];
  for (const row of rows) {
    const cells = Array.isArray(row) ? row : Object.values(row);
    if (!cells || cells.length === 0) continue;
    let data = null, importo = null, descParts = [];
    for (const c of cells) {
      if (data === null) { const d = anyDateLikeToISO(c); if (d) { data = d; continue; } }
    }
    for (let i = cells.length - 1; i >= 0; i--) {
      const n = parseImporto(cells[i]);
      if (n !== null && importo === null) { importo = n; continue; }
      if (cells[i] !== null && cells[i] !== undefined && String(cells[i]).trim() !== '') descParts.push(String(cells[i]).trim());
    }
    if (data === null || importo === null) continue;
    const descrizione = descParts.reverse().join(' ').trim() || 'Movimento';
    out.push({ id: uid(), data, descrizione, importo, categoria: categorizza(descrizione) });
  }
  return out;
}
const REVOLUT_HEADER_ALIASES = {
  startedDate: ['started date'],
  completedDate: ['completed date'],
  description: ['description'],
  amount: ['amount'],
  state: ['state'],
};
function detectRevolutHeaderRow(rows) {
  const limit = Math.min(rows.length, 10);
  for (let i = 0; i < limit; i++) {
    const row = rows[i] || [];
    const norm = row.map(normHeaderCell);
    const idxOf = (aliases) => norm.findIndex(c => aliases.includes(c));
    const amountIdx = idxOf(REVOLUT_HEADER_ALIASES.amount);
    const descIdx = idxOf(REVOLUT_HEADER_ALIASES.description);
    const completedIdx = idxOf(REVOLUT_HEADER_ALIASES.completedDate);
    const startedIdx = idxOf(REVOLUT_HEADER_ALIASES.startedDate);
    if (amountIdx !== -1 && descIdx !== -1 && (completedIdx !== -1 || startedIdx !== -1)) {
      return { rowIndex: i, amount: amountIdx, description: descIdx, completedDate: completedIdx, startedDate: startedIdx, state: idxOf(REVOLUT_HEADER_ALIASES.state) };
    }
  }
  return null;
}
function parseRevolutRows(rows, map) {
  const out = [];
  const get = (row, idx) => (idx === -1 || idx === undefined) ? undefined : row[idx];
  for (let i = map.rowIndex + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.length === 0) continue;
    const stato = String(get(row, map.state) || '').trim().toUpperCase();
    if (stato && stato !== 'COMPLETED') continue;
    const importo = parseImporto(get(row, map.amount));
    if (importo === null || importo === 0) continue;
    const dataISO = anyDateLikeToISO(get(row, map.completedDate)) || anyDateLikeToISO(get(row, map.startedDate));
    if (!dataISO) continue;
    const descrizione = String(get(row, map.description) || 'Movimento Revolut').trim().slice(0, 160);
    out.push({ id: uid(), data: dataISO, descrizione, importo, categoria: categorizza(descrizione) });
  }
  return out;
}
function parseRowsToMovimenti(rows) {
  const finecoMap = detectFinecoHeaderRow(rows);
  if (finecoMap) {
    const parsed = parseFinecoRows(rows, finecoMap);
    if (parsed.length > 0) return parsed;
  }
  const revolutMap = detectRevolutHeaderRow(rows);
  if (revolutMap) {
    const parsed = parseRevolutRows(rows, revolutMap);
    if (parsed.length > 0) return parsed;
  }
  return parseRowsToMovimentiGeneric(rows);
}
function parsePastedText(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const rows = lines.map(l => l.split(/;|\t|,(?=[^,]*$)/).map(s => s.trim()));
  return parseRowsToMovimenti(rows);
}

const MESI_IT_ABBR = { gen:1, feb:2, mar:3, apr:4, mag:5, giu:6, lug:7, ago:8, set:9, ott:10, nov:11, dic:12 };
function parseItalianAbbrDate(s) {
  const m = String(s).trim().match(/^(\d{1,2})\s+([a-z]{3})\s+(\d{4})$/i);
  if (!m) return null;
  const mese = MESI_IT_ABBR[m[2].toLowerCase()];
  if (!mese) return null;
  return `${m[3]}-${String(mese).padStart(2,'0')}-${m[1].padStart(2,'0')}`;
}
// L'estratto conto PDF "consolidato" di Revolut elenca i movimenti in una tabella con 8 colonne
// (Data, Descrizione, Categoria, Denaro in entrata/uscita, Saldo, Imposte ritenute, Altre imposte, Costi):
// una volta ricostruite le righe (vedi extractPdfText), ogni riga di movimento ha questa forma fissa.
function parseRevolutStatementLines(text) {
  const lines = (text || '').split('\n').map(l => l.trim()).filter(Boolean);
  const rowRegex = /^(\d{1,2}\s+[a-z]{3}\s+\d{4})\s+(.+?)\s+(-?[\d.,]+)\s*€\s+-?[\d.,]+\s*€\s+-?[\d.,]+\s*€\s+-?[\d.,]+\s*€\s+-?[\d.,]+\s*€\s*$/i;
  const out = [];
  for (const line of lines) {
    const m = line.match(rowRegex);
    if (!m) continue;
    const dataISO = parseItalianAbbrDate(m[1]);
    const importo = parseImporto(m[3]);
    if (!dataISO || importo === null || importo === 0) continue;
    const descrizione = m[2].trim().slice(0, 160);
    out.push({ id: uid(), data: dataISO, descrizione, importo, categoria: categorizza(descrizione) });
  }
  return out;
}
// L'altro formato PDF di Revolut ("estratto conto" per singolo conto, invece del riepilogo consolidato)
// ha tabella Data/Descrizione/Denaro in uscita/Denaro in entrata/Saldo con una sola colonna importo
// (uscita o entrata, mai entrambe): il segno si deduce confrontando il saldo di questa riga con quello
// della riga precedente (saldo cresciuto = entrata, saldo diminuito = uscita), partendo dal "Saldo
// iniziale" dichiarato nel riepilogo in testa al documento.
function parseRevolutAccountStatementLines(text) {
  const lines = (text || '').split('\n').map(l => l.trim()).filter(Boolean);
  let saldoPrecedente = null;
  for (const line of lines) {
    const m = line.match(/^Conto.*?(-?[\d.,]+)\s*€\s+-?[\d.,]+\s*€\s+-?[\d.,]+\s*€\s+-?[\d.,]+\s*€\s*$/i);
    if (m) { saldoPrecedente = parseImporto(m[1]); break; }
  }
  const rowRegex = /^(\d{1,2}\s+[a-z]{3}\s+\d{4})\s+(.+?)\s+(-?[\d.,]+)\s*€\s+(-?[\d.,]+)\s*€\s*$/i;
  const out = [];
  for (const line of lines) {
    const m = line.match(rowRegex);
    if (!m) continue;
    const dataISO = parseItalianAbbrDate(m[1]);
    const importoAssoluto = parseImporto(m[3]);
    const saldoDopo = parseImporto(m[4]);
    if (!dataISO || importoAssoluto === null || saldoDopo === null) continue;
    const importo = saldoPrecedente === null
      ? -Math.abs(importoAssoluto)
      : (saldoDopo >= saldoPrecedente ? Math.abs(importoAssoluto) : -Math.abs(importoAssoluto));
    saldoPrecedente = saldoDopo;
    if (importo === 0) continue;
    const descrizione = m[2].trim().slice(0, 160);
    out.push({ id: uid(), data: dataISO, descrizione, importo, categoria: categorizza(descrizione) });
  }
  return out;
}
function parsePdfTextToMovimenti(text) {
  const revolutParsed = parseRevolutStatementLines(text);
  if (revolutParsed.length > 0) return revolutParsed;
  const revolutAccountParsed = parseRevolutAccountStatementLines(text);
  if (revolutAccountParsed.length > 0) return revolutAccountParsed;
  return parsePastedText(text);
}

async function scanMovimentiLocalFiles(fileList, onProgress) {
  const allFiles = Array.from(fileList || []).filter(f => /\.(csv|xlsx?|xls|pdf)$/i.test(f.name));
  const movimenti = [];
  const skipped = [];
  for (const f of allFiles) {
    onProgress && onProgress(f.name);
    try {
      let parsed = [];
      if (/\.(csv|xlsx|xls)$/i.test(f.name)) {
        const buf = await f.arrayBuffer();
        const wb = XLSX.read(buf, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true });
        parsed = parseRowsToMovimenti(rows);
      } else if (/\.pdf$/i.test(f.name)) {
        const buf = await f.arrayBuffer();
        const text = await extractPdfText(buf);
        if (text) parsed = parsePdfTextToMovimenti(text);
      }
      if (parsed.length > 0) movimenti.push(...parsed);
      else skipped.push({ name: f.name, reason: 'Nessun movimento riconosciuto' });
    } catch (e) {
      skipped.push({ name: f.name, reason: 'Errore lettura file' });
    }
  }
  return { movimenti, skipped, totalFound: allFiles.length };
}

function Dropzone({ onFilesRows, onMovimentiParsed, label, sub, icon: Icon }) {
  const [over, setOver] = useState(false);
  const fileInputRef = useRef(null);

  const handleRealFile = async (file) => {
    if (/\.pdf$/i.test(file.name)) {
      try {
        const buf = await file.arrayBuffer();
        const text = await extractPdfText(buf);
        const movimenti = text ? parsePdfTextToMovimenti(text) : [];
        if (onMovimentiParsed) onMovimentiParsed(movimenti, file.name);
        else onFilesRows([], file.name, movimenti.length === 0);
      } catch (err) {
        if (onMovimentiParsed) onMovimentiParsed([], file.name);
        else onFilesRows([], file.name, true);
      }
      return;
    }
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true });
        onFilesRows(rows, file.name);
      } catch (err) {
        onFilesRows([], file.name, true);
      }
    };
    reader.readAsArrayBuffer(file);
  };

  const handleDrop = (e) => {
    e.preventDefault(); setOver(false);
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) handleRealFile(file);
  };

  return (
    <div
      onDragOver={(e) => { e.preventDefault(); setOver(true); }}
      onDragLeave={() => setOver(false)}
      onDrop={handleDrop}
      onClick={() => fileInputRef.current && fileInputRef.current.click()}
      className={"cursor-pointer border-2 border-dashed rounded-xl px-4 py-6 flex flex-col items-center justify-center text-center gap-1.5 transition-colors " +
        (over ? "border-indigo-400 bg-indigo-500/10" : "border-white/15 hover:border-indigo-400/50 hover:bg-white/[0.03]")}>

function MovimentiDashboard() {
  const { movements, setMovements, resetDashboard, pushToast, period, setPeriod } = useApp();
  const [pasteText, setPasteText] = useState('');
  const [search, setSearch] = useState('');
  const [filterCat, setFilterCat] = useState('tutte');
  const [manual, setManual] = useState({ data:'', descrizione:'', importo:'' });

  const mergeDedup = (parsed, sourceLabel, emptyMsg) => {
    if (parsed.length === 0) { pushToast(emptyMsg, 'warn'); return; }
    let addedCount = 0, dupCount = 0;
    setMovements(prev => {
      const existingKeys = new Set(prev.map(movementKey));
      const fresh = [];
      for (const m of parsed) {
        const k = movementKey(m);
        if (existingKeys.has(k)) { dupCount++; continue; }
        existingKeys.add(k);
        fresh.push(m);
      }
      addedCount = fresh.length;
      return fresh.length > 0 ? [...fresh, ...prev] : prev;
    });
    if (addedCount === 0) {
      pushToast(`Nessun movimento nuovo: tutte le ${dupCount} righe di ${sourceLabel} erano già presenti.`, 'warn');
    } else if (dupCount > 0) {
      pushToast(`${addedCount} nuovi movimenti importati da ${sourceLabel} (${dupCount} già presenti, ignorati)`);
    } else {
      pushToast(`${addedCount} movimenti importati da ${sourceLabel}`);
    }
  };
  const onFilesRows = (rows, filename, error) => {
    if (error) { pushToast('Non riesco a leggere ' + filename + '.', 'error'); return; }
    const parsed = parseRowsToMovimenti(rows);
    mergeDedup(parsed, filename, 'Nessun movimento riconosciuto in ' + filename + '. Aggiungilo manualmente.');
  };
  const onMovimentiParsed = (parsed, filename) => {
    mergeDedup(parsed, filename, 'Nessun movimento riconosciuto in ' + filename + '. Aggiungilo manualmente.');
  };
  const handlePasteImport = () => {
    const parsed = parsePastedText(pasteText);
    if (parsed.length > 0) setPasteText('');
    mergeDedup(parsed, 'testo incollato', 'Nessuna riga valida trovata. Formato: data;descrizione;importo');
  };
  const handleManualAdd = () => {
    const data = parseData(manual.data) || manual.data;
    const importo = parseImporto(manual.importo);
    if (!data || !manual.descrizione || importo === null) { pushToast('Compila data, descrizione e importo.', 'warn'); return; }
    setMovements(prev => [{ id: uid(), data, descrizione: manual.descrizione, importo, categoria: categorizza(manual.descrizione) }, ...prev]);
    setManual({ data:'', descrizione:'', importo:'' });
    pushToast('Movimento aggiunto');
  };
  const removeMovement = (id) => {
    const removed = movements.find(m => m.id === id);
    setMovements(prev => prev.filter(m => m.id !== id));
    if (removed) {
      pushToast('Movimento eliminato', 'warn', { label: 'Annulla', onClick: () => setMovements(prev => [removed, ...prev]) });
    }
  };

  const updateCategoria = (id, categoria) => setMovements(prev => prev.map(m => m.id === id ? { ...m, categoria, categoriaManuale: true } : m));

  const ricalcolaCategorie = () => {
    let cambiati = 0;
    setMovements(prev => prev.map(m => {
      if (m.categoriaManuale) return m;
      const nuova = categorizza(m.descrizione);
      if (nuova === m.categoria) return m;
      cambiati++;
      return { ...m, categoria: nuova };
    }));
    pushToast(cambiati > 0 ? `${cambiati} movimento/i ricategorizzato/i con le regole aggiornate.` : 'Nessun movimento da aggiornare: le categorie sono già allineate.');
  };

  const inPeriodMovements = useMemo(() => movements.filter(m => inPeriod(m.data, period)), [movements, period]);

  const filtered = useMemo(() => inPeriodMovements
    .filter(m => filterCat === 'tutte' || m.categoria === filterCat)

  const catBreakdown = useMemo(() => {

  const maxCatTotal = Math.max(1, ...catBreakdown.map(x => x.total));

/* ============================== ANALISI SPESE ============================== */

const ISTAT_SPESA_FONTE = 'ISTAT, "Spese per i consumi delle famiglie – Anno 2024" (comunicato stampa, ottobre 2025)';
const ISTAT_SPESA_TOTALE_MENSILE = 2755;
const ISTAT_SPESA_MEDIA = {
  alimentari: Math.round(ISTAT_SPESA_TOTALE_MENSILE * 0.193),
  abitazione: Math.round(ISTAT_SPESA_TOTALE_MENSILE * 0.357),
  svago: Math.round(ISTAT_SPESA_TOTALE_MENSILE * 0.038),
  ristorazione: Math.round(ISTAT_SPESA_TOTALE_MENSILE * 0.059),
};
// Spesa media mensile familiare ISTAT 2024 per numero di componenti (fonte: comunicato stampa
// "Spese per i consumi delle famiglie – Anno 2024"): la spesa NON cresce proporzionalmente al numero
// di persone, per effetto delle economie di scala. Valori per 1-3 componenti sono quelli pubblicati;
// oltre i 3 si estrapola l'incremento marginale osservato tra 2 e 3 componenti, facendolo decadere
// geometricamente (stima, non dato ISTAT diretto).
const ISTAT_SPESA_PER_COMPONENTI = { 1: 1932, 2: 2841, 3: 3331 };
function istatSpesaPerComponenti(n) {
  const k = Math.max(1, Math.round(n) || 1);
  if (ISTAT_SPESA_PER_COMPONENTI[k]) return ISTAT_SPESA_PER_COMPONENTI[k];
  const delta2 = ISTAT_SPESA_PER_COMPONENTI[2] - ISTAT_SPESA_PER_COMPONENTI[1];
  const delta3 = ISTAT_SPESA_PER_COMPONENTI[3] - ISTAT_SPESA_PER_COMPONENTI[2];
  const ratio = delta3 / delta2;
  let totale = ISTAT_SPESA_PER_COMPONENTI[3];
  let delta = delta3;
  for (let i = 4; i <= k; i++) {
    delta *= ratio;
    totale += delta;
  }
  return Math.round(totale);
}

function AnalisiSpeseDashboard() {
  const { movements, period, setPeriod, numeroComponenti, setNumeroComponenti, resetDashboard } = useApp();

  const inPeriodMovements = useMemo(() => movements.filter(m => inPeriod(m.data, period)), [movements, period]);
  const monthsCount = period.mese ? 1 : 12;
  // Scala i riferimenti ISTAT (calibrati sulla famiglia media nazionale) in base al numero di componenti
  // della propria famiglia, così il confronto è tra spese comparabili e non gonfiato/sgonfiato solo perché
  // il nucleo familiare è più piccolo o più grande della media.
  const fattoreScalaFamiglia = istatSpesaPerComponenti(numeroComponenti) / ISTAT_SPESA_TOTALE_MENSILE;

  const totals = useMemo(() => {
    const t = {};
    inPeriodMovements
      .filter(m => EXPENSE_CATS.includes(m.categoria))
      .forEach(m => { t[m.categoria] = (t[m.categoria] || 0) + Math.abs(m.importo); });
    return t;
  }, [inPeriodMovements]);

  const monthlyAvg = (cat) => (totals[cat] || 0) / monthsCount;

  // Riferimento ISTAT disponibile solo per le voci coperte dal comunicato stampa: "Casa" include anche le
  // bollette nel dato ISTAT "Abitazione" (non c'è uno spacchettamento ufficiale dei due), quindi il confronto
  // compare solo sulla riga Casa per non mostrare due volte lo stesso totale.
  const istatRefPerCategoria = {
    spesa: { istat: ISTAT_SPESA_MEDIA.alimentari * fattoreScalaFamiglia, note: null },
    ristorazione: { istat: ISTAT_SPESA_MEDIA.ristorazione * fattoreScalaFamiglia, note: "Media ISTAT: 'Servizi di ristorazione e alloggio'." },
    svago: { istat: ISTAT_SPESA_MEDIA.svago * fattoreScalaFamiglia, note: "Media ISTAT: 'Ricreazione, sport e cultura'." },
    casa: { istat: ISTAT_SPESA_MEDIA.abitazione * fattoreScalaFamiglia, note: "Media ISTAT 'Abitazione': include anche le bollette e l'affitto figurativo per chi possiede casa (qui sotto sono voci separate)." },
  };
  const dettaglioCategorie = useMemo(() =>
    EXPENSE_CATS
      .map(cat => ({ cat, meta: CATEGORY_META[cat], totale: totals[cat] || 0, media: monthlyAvg(cat) }))
      .filter(c => c.totale > 0)
      .sort((a,b) => b.totale - a.totale),
    [totals, monthsCount]);
  const maxDettaglio = Math.max(1, ...dettaglioCategorie.map(c => c.totale));

  const widgets = [
    { id:'filtro', title:'Periodo di Confronto', icon: Icons.Calendar, accent:'text-fuchsia-500', render: (
      <div className="p-4 flex items-center gap-2 flex-wrap">
        <select value={period.mese === null ? 'tutti' : period.mese}
          onChange={(e) => setPeriod(p => ({ ...p, mese: e.target.value === 'tutti' ? null : Number(e.target.value) }))}
          className="text-xs font-medium bg-white/5 border border-white/10 rounded-lg px-2 py-2 text-zinc-200 focus:outline-none focus:ring-2 focus:ring-white/10">
          <option value="tutti">Tutti i mesi (media annua)</option>
          {MESI.map((m,i) => <option key={i} value={i+1}>{m}</option>)}
        </select>
        <select value={period.anno}
          onChange={(e) => setPeriod(p => ({ ...p, anno: Number(e.target.value) }))}
          className="text-xs font-medium bg-white/5 border border-white/10 rounded-lg px-2 py-2 text-zinc-200 w-20 focus:outline-none focus:ring-2 focus:ring-white/10">
          {ANNI.map(a => <option key={a} value={a}>{a}</option>)}
        </select>
        <div className="flex items-center gap-1.5 shrink-0">
          <label className="text-[10.5px] text-zinc-500 whitespace-nowrap">Componenti famiglia</label>
          <input type="number" min="1" max="10" step="1" value={numeroComponenti}
            onChange={(e) => setNumeroComponenti(Math.max(1, Number(e.target.value) || 1))}
            className="w-14 text-xs font-medium bg-white/5 border border-white/10 rounded-lg px-2 py-2 text-zinc-200 focus:outline-none focus:ring-2 focus:ring-white/10" />
        </div>
        <p className="text-[10.5px] text-zinc-500 flex-1 min-w-[220px]">
          Aggrega i movimenti Fineco e Revolut per voce di spesa. I giroconti "Fineco → Revolut" non vengono contati come spesa (sono solo trasferimenti interni): a contare è la spesa reale fatta poi con Revolut. Il confronto ISTAT è calibrato sui componenti della tua famiglia, non sulla media nazionale grezza.
        </p>

const PORTAFOGLIO_HEADER_ALIASES = {
  titolo: ['titolo'],
  isin: ['isin'],
  quantita: ['quantità', 'quantita'],
  pma: ['p.zo medio di carico', 'pzo medio di carico', 'prezzo medio di carico'],
  prezzoCorrente: ['p.zo di mercato', 'pzo di mercato', 'prezzo di mercato'],
  valoreDiCarico: ['valore di carico'],
  valoreDiMercato: ['valore di mercato €', 'valore di mercato'],
};
function detectPortafoglioHeaderRow(rows) {
  const limit = Math.min(rows.length, 15);
  for (let i = 0; i < limit; i++) {
    const row = rows[i] || [];
    const norm = row.map(normHeaderCell);
    const idxOf = (aliases) => norm.findIndex(c => aliases.includes(c));
    const isinIdx = idxOf(PORTAFOGLIO_HEADER_ALIASES.isin);
    const pmaIdx = idxOf(PORTAFOGLIO_HEADER_ALIASES.pma);
    if (isinIdx !== -1 && pmaIdx !== -1) {
      return {
        rowIndex: i,
        titolo: idxOf(PORTAFOGLIO_HEADER_ALIASES.titolo),
        isin: isinIdx,
        quantita: idxOf(PORTAFOGLIO_HEADER_ALIASES.quantita),
        pma: pmaIdx,
        prezzoCorrente: idxOf(PORTAFOGLIO_HEADER_ALIASES.prezzoCorrente),
        valoreDiCarico: idxOf(PORTAFOGLIO_HEADER_ALIASES.valoreDiCarico),
        valoreDiMercato: idxOf(PORTAFOGLIO_HEADER_ALIASES.valoreDiMercato),
      };
    }
  }
  return null;
}
function parsePortafoglioRows(rows, map) {
  const out = [];
  const get = (row, idx) => (idx === -1 || idx === undefined) ? undefined : row[idx];
  for (let i = map.rowIndex + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.length === 0) continue;
    const isinRaw = get(row, map.isin);
    if (!isinLike(isinRaw)) continue;
    const isin = String(isinRaw).trim().toUpperCase();
    const pma = parseImporto(get(row, map.pma));
    if (pma === null) continue;
    const prezzoCorrente = parseImporto(get(row, map.prezzoCorrente)) ?? pma;
    const nome = String(get(row, map.titolo) || isin).trim();
    // Alcuni strumenti (es. obbligazioni/BTP) quotano il prezzo come % del nominale
    // (es. 98,84 = 98,84% di 100), mentre "Quantità" riporta il nominale in EUR.
    // Usiamo "Valore di carico" (già corretto in valuta) per derivare la quantità
    // effettiva, cosi valore = quantita*pma torna sempre esatto qualunque sia la convenzione.
    const valoreDiCarico = parseImporto(get(row, map.valoreDiCarico));
    let quantita = parseImporto(get(row, map.quantita)) ?? 0;
    if (valoreDiCarico !== null && pma > 0) {
      quantita = valoreDiCarico / pma;
    }
    out.push({ id: uid(), isin, nome, pma, quantita, prezzoCorrente });
  }
  return out;
}
function parseRowsToTitoliGeneric(rows) {
  const out = [];
  for (const row of rows) {
    const cells = (Array.isArray(row) ? row : Object.values(row)).filter(c => c !== null && c !== undefined && String(c).trim() !== '');
    if (cells.length === 0) continue;
    let isin = cells.find(c => isinLike(c));
    if (!isin) continue;
    isin = String(isin).trim().toUpperCase();
    const numeric = cells.filter(c => c !== isin && parseImporto(c) !== null && !parseData(c)).map(c => parseImporto(c));
    const nome = cells.filter(c => c !== isin && parseImporto(c) === null).map(c => String(c).trim()).sort((a,b)=>b.length-a.length)[0] || isin;
    const pma = numeric[0] ?? 0;
    const quantita = numeric[1] ?? 0;
    const prezzoCorrente = numeric[2] ?? pma;
    out.push({ id: uid(), isin, nome, pma, quantita, prezzoCorrente });
  }
  return out;
}
function parseRowsToTitoli(rows) {
  const map = detectPortafoglioHeaderRow(rows);
  if (map) {
    const parsed = parsePortafoglioRows(rows, map);
    if (parsed.length > 0) return parsed;
  }
  return parseRowsToTitoliGeneric(rows);
}

}

function PensioneDashboard() {
  const { pensione, setPensione, resetDashboard } = useApp();

  const set = (k,v) => setPensione(prev => ({ ...prev, [k]: v }));

  const saldoStimato = useMemo(() => stimaSaldoAttualePensione(Number(pensione.importoMensile)||0, pensione.dataInizio), [pensione.importoMensile, pensione.dataInizio]);
  const proiezione = useMemo(() => buildProiezionePensione(Number(pensione.importoMensile)||0, Number(pensione.anniInvestimento)||0), [pensione.importoMensile, pensione.anniInvestimento]);
  const capitaleFinale = proiezione.length ? proiezione[proiezione.length-1].capitale : 0;
  const versatoFinale = proiezione.length ? proiezione[proiezione.length-1].versato : 0;
  const rendimento = capitaleFinale - versatoFinale;

  const deduzioneAnnua = Math.min((Number(pensione.importoMensile)||0) * 12, 5164.57);
  const risparmioAnnuo = calcolaIRPEF(Number(pensione.ral)||0) - calcolaIRPEF((Number(pensione.ral)||0) - deduzioneAnnua);
  const anni = Number(pensione.anniInvestimento) || 0;
  const risparmioCumulativo = risparmioAnnuo * anni;

  // Tassazione agevolata dei fondi pensione integrativi (art. 11 D.Lgs. 252/2005): aliquota sostitutiva
  // del 15% sul capitale maturato, che scende dello 0,3% per ogni anno di partecipazione oltre il 15°,
  // fino a un minimo del 9% al 35° anno. Molto più favorevole della tassazione IRPEF ordinaria.
  const anniVersamento = useMemo(() => {
