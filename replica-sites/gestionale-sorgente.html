<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gestionale Rossati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Gestionale Rossati, versione R.I.S. (2026-10-20), semplificato il 2026-10-21, spese unite ai movimenti il 2026-10-24: ogni numero vive in un solo posto (niente blocchi ripetuti tra Home, Movimenti, Spese, Nota spese). Scuro, arancio, vetro, come R.I.S. - Conti di Famiglia.
   Layout: navigazione a sinistra e lavoro a destra. Un solo colore forte (arancio) per "guarda qui", tre colori di stato (torna, da guardare, non torna). */
:root{
  --bg:#0D1318; --surface:#131B22; --wash:#1A242C; --ink:#E7ECEA; --muted:#8B979F; --line:#232E36; --line-strong:#3A4852;
  --accent:#E3834F; --accent-ink:#1A0C04; --accent-wash:#2A1A12; --accent-solid:#C4542A;
  --alert:#E08276; --alert-bg:#2E1C1A; --good:#4FBCA1; --good-bg:#10302A; --warn:#D6A63F; --warn-bg:#2D2410;
  --hero-ink:#F4F7F6; --hero-muted:#C2CFD3; --hero-line:rgba(255,255,255,.2); --hero-fill:#FFB58A;
  --h1a:#2A140C; --h1b:#B94A24; --h2a:#0B2B27; --h2b:#14705C; --h3a:#141D25; --h3b:#33444F;
  --glass:rgba(32,38,45,.58); --aur1:rgba(196,84,42,.14); --aur2:rgba(20,112,92,.10); --edge:rgba(255,255,255,.07);
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 20px 44px -22px rgba(0,0,0,.65);
  --t1:#E3834F; --t2:#5CC8E0; --t3:#4FBCA1; --t4:#D6A63F; --t5:#B9A0F0; --t6:#F58DB8; --t7:#8EA6FF; --t8:#E8C25A; --t9:#58D1C2; --t10:#A7AEBB; --t11:#A3D65C;
  color-scheme:dark;
  --f-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-voce:"Source Serif 4",Georgia,serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEF1F0; --surface:#FFFFFF; --wash:#F3F6F5; --ink:#0F1F26; --muted:#55646C; --line:#D6DEDD; --line-strong:#A9B7B5;
  --accent:#C4542A; --accent-ink:#FFFFFF; --accent-wash:#FBE6DB; --accent-solid:#C4542A;
  --alert:#C0392B; --alert-bg:#FBE3E0; --good:#1F7A5C; --good-bg:#D9F0E7; --warn:#8F6A0B; --warn-bg:#F8ECCF;
  --hero-fill:#F2A272;
  --glass:rgba(255,255,255,.82); --aur1:rgba(196,84,42,.08); --aur2:rgba(20,112,92,.07); --edge:rgba(15,31,38,.06);
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 18px 40px -22px rgba(30,40,70,.28);
  --t1:#C4542A; --t2:#0E7490; --t3:#1F7A5C; --t4:#8F6A0B; --t5:#6D4AA8; --t6:#BE185D; --t7:#3558C9; --t8:#A16207; --t9:#0F766E; --t10:#5B6270; --t11:#4D7C0F;
  color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EEF1F0; --surface:#FFFFFF; --wash:#F3F6F5; --ink:#0F1F26; --muted:#55646C; --line:#D6DEDD; --line-strong:#A9B7B5;
  --accent:#C4542A; --accent-ink:#FFFFFF; --accent-wash:#FBE6DB; --accent-solid:#C4542A;
  --alert:#C0392B; --alert-bg:#FBE3E0; --good:#1F7A5C; --good-bg:#D9F0E7; --warn:#8F6A0B; --warn-bg:#F8ECCF;
  --hero-fill:#F2A272;
  --glass:rgba(255,255,255,.82); --aur1:rgba(196,84,42,.08); --aur2:rgba(20,112,92,.07); --edge:rgba(15,31,38,.06);
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 18px 40px -22px rgba(30,40,70,.28);
  --t1:#C4542A; --t2:#0E7490; --t3:#1F7A5C; --t4:#8F6A0B; --t5:#6D4AA8; --t6:#BE185D; --t7:#3558C9; --t8:#A16207; --t9:#0F766E; --t10:#5B6270; --t11:#4D7C0F;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg) radial-gradient(var(--dot) 1px,transparent 1.2px) 0 0/22px 22px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 56px;overflow-x:clip;max-width:100vw;touch-action:pan-x pan-y;-webkit-font-smoothing:antialiased}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- struttura ---------- */
.wrap{max-width:1360px;margin-inline:auto;width:100%;display:grid;grid-template-columns:minmax(0,1fr);column-gap:32px;grid-template-areas:"head" "nav" "per" "main"}
header{grid-area:head;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-block:20px 14px;border-bottom:3px double var(--line-strong);margin-bottom:6px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{flex:none;width:44px;height:44px;color:var(--ink)}
.mark svg{display:block;width:100%;height:100%}
.mark rect{fill:var(--ink)} .mark path{stroke:var(--bg)}
.kicker{font:500 12px var(--f-mono);letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,6vw,38px);line-height:1;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
.date{font:12.5px var(--f-mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.zoomctl{display:inline-flex;gap:4px}
.perbar{grid-area:per;align-self:start}
nav{grid-area:nav;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:10px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;display:inline-flex;align-items:center;gap:8px;font:500 14px var(--f-body);color:var(--muted);background:none;border:1px solid transparent;border-radius:99px;padding:8px 14px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
nav button svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:var(--surface);color:var(--ink)}
nav button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
section{grid-area:main;min-width:0}
section[hidden]{display:none}

/* ---------- blocchi ---------- */
h3{font:600 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 12px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.block{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0;box-shadow:var(--shadow)}
.sub{color:var(--muted);font-size:13px;line-height:1.45}
.empty{color:var(--muted);font-size:14px;padding-block:8px;font-style:italic}
.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.93em;letter-spacing:-.01em}
.big{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:30px;font-weight:500;line-height:1.1;letter-spacing:-.02em}
.neg{color:var(--alert)} .pos{color:var(--good)}
.row{display:flex;justify-content:space-between;gap:14px;align-items:baseline;padding-block:10px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row > span:first-child{min-width:0}
.bar{height:10px;background:var(--wash);border-radius:99px;overflow:hidden;display:flex;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;border-radius:99px}
code{font-family:var(--f-mono);font-size:12.5px;background:var(--wash);padding:1px 6px;border-radius:5px}
a{color:var(--accent)}

/* saldo in evidenza: pannello inchiostro */
.alert{background:var(--hero-bg);color:var(--hero-ink);border-radius:20px;padding:22px 24px;margin-bottom:16px;display:grid;gap:14px;box-shadow:var(--shadow)}
.alert strong{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;font-size:clamp(26px,5.4vw,40px);line-height:1.1;letter-spacing:-.02em;color:var(--hero-ink)}
.alert .sub{color:var(--hero-muted)}
.alert .bar{height:12px;background:var(--hero-line);box-shadow:none}
.alert .bar i{background:var(--hero-fill)!important}
.heroes{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));margin-bottom:16px}
.heroes .alert{margin-bottom:0;align-content:start}
.alert .lbl{font:600 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--hero-muted)}
.alert strong.dneg{color:var(--hero-fill)} .alert strong.dpos{color:#6EE0A6}

/* periodo */
.perbar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-block:10px 18px;box-shadow:var(--shadow)}
.perbar label{display:grid;gap:3px;font:600 11px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.perbar .info{margin-left:auto;font:12.5px var(--f-mono);color:var(--muted);align-self:center}

/* pulsanti, campi */
.btn{font:500 14px var(--f-body);border-radius:10px;padding:9px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);transition:filter .15s,background .15s,transform .08s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.alt{background:transparent;color:var(--accent);border-color:var(--line-strong)}
.btn.alt:hover{background:var(--accent-wash);filter:none;border-color:var(--accent)}
.btn.small{padding:4px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--surface);border:1px solid var(--line);padding:3px;border-radius:13px;margin-bottom:16px}
.seg .btn{border:0;border-radius:10px;padding:7px 14px}
.seg .btn.alt{background:transparent;color:var(--muted)}
.seg .btn.alt:hover{background:var(--wash);color:var(--ink)}
input,select{font:14px var(--f-body);color:var(--ink);background:var(--wash);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input:focus,select:focus{border-color:var(--accent)}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ctrl input[type=search]{flex:1 1 180px}
form.add{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));align-items:end}
form.add label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
form.add .wide{grid-column:1/-1}

/* pill di stato */
.pill{display:inline-block;font:600 10.5px var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--wash);color:var(--muted)}
.pill.ok{color:var(--good);background:var(--good-bg)}
.pill.ko{color:var(--alert);background:var(--alert-bg)}
.pill.att{color:var(--warn);background:var(--warn-bg)}
.pill.nd{color:var(--muted);background:var(--wash)}

/* tabelle: doppia riga sui totali, come in un libro mastro */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-strong)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover td{background:var(--wash)}
td.r,th.r{text-align:right}
tr:has(> td > strong) td{border-top:3px double var(--line-strong);border-bottom:0;background:var(--wash)}

/* domanda aperta */
.ask{display:grid;gap:14px}
.ask p{margin:0;font-family:var(--f-display);font-size:25px;line-height:1.2}
.ask .acts{display:flex;gap:8px;flex-wrap:wrap}
.ask .btn{min-width:88px}

/* organigramma agenti */
.tree{display:grid;gap:16px}
.dept{position:relative;padding-left:22px}
.dept::before{content:"";position:absolute;left:2px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.dept .collab{margin-left:4px;margin-top:6px;padding-left:14px;border-left:1px dashed var(--line-strong);display:grid;gap:3px}

/* caricamento file */
.drop{border:2px dashed var(--line-strong);border-radius:16px;padding:20px;display:grid;gap:12px;justify-items:start;background:var(--wash)}
.drop.over{border-color:var(--accent);background:var(--accent-wash)}
.filebtn{display:inline-block;font:500 14px var(--f-body);border-radius:10px;padding:9px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.filein{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}

.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.block.wide{grid-column:1/-1}
.sum{cursor:pointer;list-style:none;margin-bottom:8px}
.sum::-webkit-details-marker{display:none}
.share{font:12px var(--f-mono);color:var(--muted);margin-left:8px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:440px;margin-inline:auto;background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:12px;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);z-index:20}
.toast[hidden]{display:none}

/* nota spese: elenco e catena */
.nsrow{display:grid;grid-template-columns:minmax(90px,1.2fr) minmax(80px,1fr) minmax(80px,1fr) minmax(80px,1fr) minmax(110px,1.2fr) 16px;gap:4px 14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 8px;color:inherit;font:inherit;cursor:pointer;min-height:44px;border-radius:0}
.nsrow .r{text-align:right}
.nsrow:hover,.nsrow[aria-expanded="true"]{background:var(--wash)}
.nsrow .ch{color:var(--muted);text-align:right}
.nshead{cursor:default;min-height:0;padding-block:6px;font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.nshead:hover{background:none}
.chain{background:var(--bg);border:1px solid var(--line-strong);border-radius:12px;padding:14px;margin:6px 0 12px;display:grid;gap:14px}
.steps{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.step{flex:1 1 200px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.step h4{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.arw{align-self:center;color:var(--accent);font-size:26px;font-weight:700}
.chip{display:inline-block;font:600 11.5px var(--f-body);border:1px solid var(--line-strong);border-radius:99px;padding:3px 10px;background:var(--bg);color:var(--accent);cursor:pointer}
.chip:hover{background:var(--accent-wash)}
@media (max-width:760px){.arw{display:none}}
@media (max-width:600px){.nsrow{grid-template-columns:minmax(64px,1fr) auto auto auto 12px;gap:4px 8px;font-size:14px;padding-inline:4px}.nshead{font-size:10px}.nsrow .st{display:none}}

/* ---------- misure ---------- */
@media (min-width:700px){
  body{font-size:16px;padding-inline:24px}
  nav{margin-inline:-24px;padding-inline:24px}
  .block{padding:24px}.alert{padding:26px 30px}
  h3{font-size:12px}
  .big{font-size:34px}
  nav button{font-size:15px;padding:9px 16px}
  .sub{font-size:14px}.date{font-size:13.5px}
  .ask p{font-size:28px}
}
@media (min-width:1000px){
  body{font-size:17px;padding-inline:32px}
  .wrap{grid-template-columns:240px minmax(0,1fr);grid-template-rows:auto auto 1fr;grid-template-areas:"head per" "head main" "nav main";align-items:start}
  header{flex-direction:column;align-items:flex-start;justify-content:flex-start;border-bottom:3px double var(--line-strong);padding-block:6px 20px;margin-block:16px 8px}
  .brand{flex-direction:column;align-items:flex-start;gap:14px}
  .mark{width:52px;height:52px}
  h1{font-size:40px;line-height:1.02}
  .perbar{margin-block:16px 20px}
  nav{flex-direction:column;overflow:visible;position:sticky;top:20px;align-self:start;margin-inline:0;padding:8px 0;gap:2px;background:none}
  nav button{width:100%;border-radius:11px;padding:11px 14px;font-size:15.5px;gap:13px}
  .grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
  .sub{font-size:14.5px}
  .big{font-size:38px}
}
@media (pointer:coarse){
  nav button{min-height:44px}
  .btn{min-height:44px;font-size:16px}
  .btn.small{min-height:40px;padding:6px 14px;font-size:15px}
  .seg .btn{min-height:40px}
  input,select{font-size:16px;min-height:44px}
  .filebtn{min-height:44px;font-size:16px;display:inline-flex;align-items:center}
}
@media (max-width:600px){
  body{padding-inline:16px}
  nav{margin-inline:-16px;padding-inline:16px}
  .block{padding:16px}.alert{padding:18px}
  th,td{padding:9px 8px}
  .perbar{gap:10px}.perbar .info{margin-left:0;width:100%}
}
@media (max-width:520px){ .big{font-size:26px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- ritocchi Valpolicella ---------- */
header{border-bottom:0;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,var(--accent) 0 28px,var(--hero-fill) 28px 40px,var(--t3) 40px 64px,transparent 64px 76px);border-radius:3px;opacity:.9}
.mark rect{fill:var(--accent)} .mark path{stroke:#fff} .mark .b3{stroke:var(--hero-fill)}
h1{font-family:var(--f-display);font-weight:700;letter-spacing:-.02em;font-variation-settings:"opsz" 96}
.ask p{font-family:var(--f-display);font-weight:500}
.kicker{color:var(--accent);font-weight:500}
nav button svg{color:var(--tc)}
nav button:hover{color:var(--ink)}
nav button[aria-selected="true"]{background:var(--tc);color:var(--surface);border-color:var(--tc)}
nav button[aria-selected="true"] svg{color:var(--surface)}
#home{--tc:var(--t1)} #movimenti{--tc:var(--t2)} #finanze{--tc:var(--t3)} #borsa{--tc:var(--t4)} #casa{--tc:var(--t5)}
#famiglia{--tc:var(--t6)} #lavoro{--tc:var(--t7)} #notaspese{--tc:var(--t8)} #documenti{--tc:var(--t9)} #agenti{--tc:var(--t10)} #spese{--tc:var(--t11)}
section h3::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--tc,var(--accent));margin-right:9px;vertical-align:0}
.alert{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--h3a),var(--h3b))}
.alert::after{content:"";position:absolute;right:-48px;top:-52px;width:170px;height:170px;border-radius:50%;border:30px solid rgba(255,255,255,.06);pointer-events:none}
.alert > *{position:relative}
.heroes .alert:nth-child(1){background:linear-gradient(135deg,var(--h1a),var(--h1b))}
.heroes .alert:nth-child(2){background:linear-gradient(135deg,var(--h2a),var(--h2b))}
.heroes .alert:nth-child(3){background:linear-gradient(135deg,var(--h3a),var(--h3b))}
.alert strong{font-size:clamp(28px,5.8vw,44px)}
.alert .bar{height:14px}
.oggi{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:16px}
.oggi-t{font:600 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-right:4px}

<script>
/* ingrandimento: automatico se la pagina e' mostrata rimpicciolita, poi A-/A+ a mano (si ricorda) */
(function(){
  var z=0,saved=false;
  try{var s=parseFloat(localStorage.getItem("gr_zoom"));if(s){z=s;saved=true}}catch(x){}
  if(!z){var iw=window.innerWidth,sw=(window.screen&&screen.width)||iw;z=(iw>sw*1.3&&sw<=900)?Math.min(2,iw/sw):1}
  function app(v,save){z=Math.max(.8,Math.min(2.4,v));var w=document.querySelector(".wrap");if(w)w.style.zoom=z;if(save){try{localStorage.setItem("gr_zoom",String(z))}catch(x){}}}
  window.stepZoom=function(d){app(Math.round((z+d)*10)/10,true)};
  app(z,false);
  /* pizzico con due dita: allarga per ingrandire, stringi per rimpicciolire */
  var d0=0,z0=1;
  function dist(t){var dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy)}
  document.addEventListener("touchstart",function(e){if(e.touches.length===2){d0=dist(e.touches);z0=z}},{passive:true});
  document.addEventListener("touchmove",function(e){if(e.touches.length===2&&d0){e.preventDefault();app(Math.round(z0*dist(e.touches)/d0*100)/100,false)}},{passive:false});
  document.addEventListener("touchend",function(e){if(d0&&e.touches.length<2){d0=0;app(z,true)}});
})();
var TODAY = new Date(); TODAY.setHours(0,0,0,0);
var S = {ris:{},cmp:[],cat:{regole:[],override:{}},borsa:{},bpers:"tutto",cassa:null,pens:null,pr:null,fin:[],scad:[],dec:[],agenti:[],esec:[],mov:{},schede:{casa:null,famiglia:null,lavoro:null},ns:[],nsReg:null,nsm:{abb:[],escl:[]},ric:[],doc:[],dir:null,mem:null,pra:[],bac:[],reg:[],ready:{},evt:[]};
var db = null, tab = "home", movMese = "", movQ = "", movT = "";
var eur = new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR",useGrouping:"always"});
var eur0 = new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR",maximumFractionDigits:0,useGrouping:"always"});
var nf=new Intl.NumberFormat("it-IT",{maximumFractionDigits:2,useGrouping:"always"});

function gg(s){var d=Math.round((new Date(s+"T00:00:00")-TODAY)/864e5);return d===0?"oggi":d===1?"domani":d===-1?"ieri":d<0?(-d)+" giorni fa":"tra "+d+" giorni"}

document.getElementById("oggi").textContent = TODAY.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

/* ---- calcoli sui movimenti ---- */
function isRimb(r){return r.y==="entrata"&&r.i>0&&r.i<2000&&r.k==="Altre Entrate"&&/eurofood/i.test(r.t||"")}
function tot(righe){var e=0,u=0,inv=0,tasse=0,rb=0;righe.forEach(function(r){if(r.s==="a")return;
  if(r.y==="entrata"){if(isRimb(r))rb+=r.i;else e+=r.i} else if(r.y==="spesa_vera"||r.y==="carta")u-=r.i; else if(r.y==="investimento")inv+=r.i; else if(r.y==="tassa_titoli")tasse-=r.i;});
  return {e:e,u:u,inv:inv,tasse:tasse,rb:rb}}
function mesi(){return Object.keys(S.mov).sort()}
/* ---- periodo globale: anno e mese valgono per tutte le schede ---- */
var PER={y:"",m:""};
var MN=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
function pad2(n){return (n<10?"0":"")+n}
function isoDay(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function perInit(){
  var ms=mesi(); if(!ms.length||PER.y) return;
  var l=ms[ms.length-1]; PER.y=l.slice(0,4); PER.m=l.slice(5);
  try{var s=JSON.parse(localStorage.getItem("gr_per")||"null"); if(s&&(s.y==="tutti"||ms.some(function(m){return m.slice(0,4)===s.y}))){PER.y=s.y;PER.m=s.m||"tutto"}}catch(x){}
}
function perSave(){try{localStorage.setItem("gr_per",JSON.stringify(PER))}catch(x){}}
function perMese(){return !!PER.m&&PER.m!=="tutto"}
function inPer(d){ if(!PER.y) return false; if(PER.y!=="tutti"&&d.slice(0,4)!==PER.y) return false; if(perMese()&&d.slice(5,7)!==PER.m) return false; return true}
function perMesi(){return mesi().filter(function(m){return inPer(m+"-01")})}
function perRows(){var o=[];perMesi().forEach(function(m){S.mov[m].forEach(function(r){if(inPer(r.d))o.push(r)})});return o}
function perLabel(){if(!PER.y)return "";if(PER.y==="tutti")return perMese()?(MN[+PER.m-1]+", tutti gli anni"):"Tutti gli anni";return perMese()?mlabel(PER.y+"-"+PER.m):"Anno "+PER.y}
function perEnd(){if(PER.y==="tutti")return isoDay(TODAY);if(perMese())return PER.y+"-"+PER.m+"-"+pad2(new Date(+PER.y,+PER.m,0).getDate());return PER.y+"-12-31"}
function lastDay(){var ms=mesi(),l="";ms.forEach(function(m){S.mov[m].forEach(function(r){if(r.d>l)l=r.d})});return l}
function saldoA(end){var c=S.cassa;if(!c)return null;var s=0,s0=0;mesi().forEach(function(m){S.mov[m].forEach(function(r){if(r.c==="F"&&r.s!=="a"){if(r.d<=end)s+=r.i;if(r.d<=c.data)s0+=r.i}})});return Math.round((c.saldo-s0+s)*100)/100}
function perBar(){

/* stima di chiusura del mese in corso: differenza di oggi + quello che sappiamo che arriva (stipendio, rate e scadenze non ancora viste) */
function stimaMese(d0){
  var mk=isoDay(TODAY).slice(0,7), rows=(S.mov[mk]||[]).filter(function(r){return r.s!=="a"}), used={};
  function trova(rata){for(var i=0;i<rows.length;i++){if(!used[i]&&rows[i].i<0&&Math.abs(-rows[i].i-rata)<=0.02){used[i]=1;return true}}return false}
  var usc=[], ent=[];
  S.fin.filter(function(f){return f.attivo!==false&&f.rata}).forEach(function(f){if(f.firmato&&f.firmato.slice(0,7)===mk)return;if(!trova(f.rata))usc.push({n:f.nome,i:f.rata,g:f.giorno})});
  S.scad.filter(function(x){return x.data.slice(0,7)===mk&&!x.pagata}).forEach(function(x){
    if(usc.some(function(u){return Math.abs(u.i-x.importo)<=0.02}))return; usc.push({n:x.nome,i:x.importo,g:+x.data.slice(8)})});
  [["Eurofood",/eurofood/i,30],["Crisby",/crisby/i,20]].forEach(function(src){
    if(rows.some(function(r){return r.y==="entrata"&&r.k==="Stipendio"&&src[1].test(r.t||"")}))return;
    var st=[]; mesi().forEach(function(m){S.mov[m].forEach(function(r){if(r.y==="entrata"&&r.k==="Stipendio"&&r.s!=="a"&&src[1].test(r.t||""))st.push([r.d,r.i])})});
    st.sort(function(a,b){return a[0]<b[0]?-1:1}); var v=st.slice(-6).map(function(x){return x[1]}).sort(function(a,b){return a-b});
    if(v.length){var med=(v[Math.floor((v.length-1)/2)]+v[Math.ceil((v.length-1)/2)])/2; ent.push({n:"Stipendio "+src[0]+" (mediana degli ultimi 6)",i:Math.round(med),g:src[2]})}
  });
  var u=usc.reduce(function(a,x){return a+x.i},0), e=ent.reduce(function(a,x){return a+x.i},0);
  return {usc:usc,ent:ent,tot:Math.round((d0+e-u)*100)/100,u:u,e:e};
